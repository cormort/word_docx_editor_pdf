<style>
:root{--blue:#2563eb;--green:#059669;--slate:#334155;--line:#dbe3ee;--bg:#eef2f7;--warn:#fffbeb}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:#1e293b}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0f172a10}.topin,.wrap{max-width:1280px;margin:auto}.topin{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#64748b;margin:3px 0 0}.actions,.tools,.findbar,.settings{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn,.tool,select,input{font:inherit}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover,.tool:hover{background:#f8fafc}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1d4ed8}.pdf{background:var(--green);border-color:var(--green);color:white}.pdf:hover{background:#047857}.wrap{padding:18px}.notice{display:none;background:var(--warn);border:1px solid #fde68a;color:#854d0e;padding:11px 14px;border-radius:12px;margin-bottom:12px}.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 3px 12px #0f172a0c}.tool{border:0;background:white;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:37px}.sep{height:28px;width:1px;background:var(--line);margin:0 3px}.tools select,.findbar input,.filename{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.settings{margin-left:auto}.findbar{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.findres{flex-basis:100%;display:none}.findres.show{display:block}.findhead{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}.findhead span{margin-right:auto}#findList{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}#findList:empty{display:none}.hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:8px 10px;font:inherit;font-size:14px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}.hit:last-child{border-bottom:0}.hit small{color:#64748b;margin-right:6px}.hit mark{background:#fde68a;padding:0 1px}.hit.cur{background:#eff6ff}::highlight(find){background:#fde68a}::highlight(find-cur){background:#f59e0b;color:#fff}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:13px auto 7px;max-width:210mm;font-size:12px;color:#64748b}.filename{width:320px;color:#1e293b;font-weight:700}.paper{width:210mm;min-height:297mm;margin:auto;background:white;padding:18mm;box-shadow:0 10px 30px #0f172a25;outline:none;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;font-size:16px;line-height:1.75;overflow-wrap:anywhere}.paper.landscape{width:297mm;min-height:210mm}.paper h1{font-size:30px;margin:.5em 0}.paper h2{font-size:24px}.paper img{max-width:100%;height:auto}.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #94a3b8;padding:6px}.statusbusy{opacity:.65;pointer-events:none}@media(max-width:900px){.topin{align-items:flex-start;flex-direction:column}.settings{margin-left:0}.paper,.paper.landscape{width:100%;min-height:70vh;padding:28px}.meta{max-width:none}}@media(max-width:640px){.topin{padding:8px 12px;gap:8px;flex-direction:row;align-items:center}.brand{display:none}.actions{flex:1}.actions .btn{flex:1}.logo{width:36px;height:36px;font-size:19px}.actions{flex-wrap:nowrap;gap:6px}.btn{padding:10px 8px;min-height:42px;white-space:nowrap;font-size:14px}.wrap{padding:8px}.toolbar{position:sticky;top:57px;z-index:9;padding:6px;border-radius:12px}.tools{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool,.tools select{flex:none;min-height:42px;min-width:42px}.settings{display:flex;flex-wrap:nowrap}.findbar input{flex:1 1 40%;min-width:0}.meta{flex-direction:column;align-items:stretch;gap:4px;margin:8px 0}.filename{width:100%}.paper,.paper.landscape{padding:16px;min-height:60vh;box-shadow:0 4px 14px #0f172a20}.paper h1{font-size:24px}.paper h2{font-size:20px}.paper table{display:block;overflow-x:auto}}input,select{font-size:16px}body.desk .paper{width:210mm;min-height:297mm;padding:18mm}body.desk .paper.landscape{width:297mm;min-height:210mm}body.desk:not(.finding) .toolbar,body.desk .tools,body.desk #replaceText,body.desk #replaceOne,body.desk #replaceAll,body.desk .meta,body.desk .notice{display:none!important}body.desk .findbar{border:0;margin:0;padding:0}.readbar{display:none;gap:8px;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20}.readbar .btn{box-shadow:0 4px 14px #0f172a40}body.desk .readbar{display:flex}.tool.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}body.dragging .paper{outline:3px dashed var(--blue);outline-offset:4px}.img-drop{color:#94a3b8;font-size:13px}@media print{body.dragging .paper{outline:0}}@media print{body{background:white}.no-print{display:none!important}.wrap{padding:0}.paper,.paper.landscape{zoom:1!important;box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}}

<style id="pageStyle"></style>

<body>
<header class="top no-print"><div class="topin"><div class="brand"><div class="logo">W</div><div><h1>Word 文件簡易編輯器</h1><p>檔案在本機瀏覽器處理，不主動上傳</p></div></div><div class="actions"><input id="file" type="file" accept=".doc,.docx" hidden><input id="imageFile" type="file" accept="image/*" hidden><button class="btn" id="newBtn">新文件</button><button class="btn primary" id="openBtn">載入 Word</button><button class="btn" id="saveBtn">儲存 HTML</button><button class="btn pdf" id="pdfBtn">轉換 PDF</button></div></div></header>
<div class="wrap"><div id="notice" class="notice no-print" role="alert"></div><section class="toolbar no-print"><div class="tools"><select id="blockStyle" title="段落樣式" aria-label="段落樣式"><option value="p" selected>內文</option><option value="h1">標題 1</option><option value="h2">標題 2</option><option value="h3">標題 3</option><option value="blockquote">引言</option><option value="pre">預格式</option></select><button class="tool" data-cmd="undo" title="復原" aria-label="復原">↶</button><button class="tool" data-cmd="redo" title="重做" aria-label="重做">↷</button><span class="sep"></span><select id="fontSize" title="字級" aria-label="字級"><option value="2">小字</option><option value="3" selected>一般</option><option value="4">大字</option><option value="5">標題</option></select><button class="tool" data-cmd="bold" aria-label="粗體" aria-pressed="false"><b>B</b></button><button class="tool" data-cmd="italic" aria-label="斜體" aria-pressed="false"><i>I</i></button><button class="tool" data-cmd="underline" aria-label="底線" aria-pressed="false"><u>U</u></button><span class="sep"></span><button class="tool" data-cmd="justifyLeft">靠左</button><button class="tool" data-cmd="justifyCenter">置中</button><button class="tool" data-cmd="justifyRight">靠右</button><button class="tool" data-cmd="insertUnorderedList">• 清單</button><button class="tool" data-cmd="insertOrderedList">1. 編號</button><span class="sep"></span><button class="tool" id="findToggle">尋找取代</button><button class="tool" id="deskToggle" title="以電腦版 A4 版面唯讀檢視，縮放至螢幕寬">閱讀模式</button><button class="tool" id="imgBtn" title="插入圖片" aria-label="插入圖片">圖片</button><button class="tool" id="tblBtn" title="插入表格" aria-label="插入表格">表格</button><button class="tool" id="linkBtn" title="插入連結" aria-label="插入連結">連結</button><button class="tool" onclick="window.print()">列印</button><div class="settings"><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select><select id="orientation"><option value="portrait">直向</option><option value="landscape">橫向</option></select></div></div><div id="findbar" class="findbar"><input id="findText" placeholder="尋找：多個關鍵字用空格，/正則/" enterkeyhint="search"><input id="replaceText" placeholder="取代為"><button class="btn" id="replaceOne">取代</button><button class="btn" id="replaceAll">全部取代</button><div id="findRes" class="findres"><div class="findhead"><span id="findCount"></span><button class="tool" id="findPrev" title="上一筆">‹</button><button class="tool" id="findNext" title="下一筆">›</button></div><div id="findList"></div></div></div></section><div class="meta no-print"><input id="filename" class="filename" value="未命名文件"><span id="status" aria-live="polite">請載入 DOCX 文件，或直接開始輸入內容</span></div><article id="editor" class="paper" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="文件內容"><h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p></article></div>
<div class="readbar no-print"><button id="readFind" class="btn">搜尋</button><button id="readExit" class="btn primary">結束閱讀</button></div>
<script>
const $=s=>document.querySelector(s), editor=$('#editor'), statusEl=$('#status'), notice=$('#notice');
function msg(text,warn=false){statusEl.textContent=text;if(warn){notice.textContent=text;notice.style.display='block'}}
const LIB={mammoth:'vendor/mammoth.browser.min.js',html2pdf:'vendor/html2pdf.bundle.min.js'};
// 載入失敗的 script 一定要從 DOM 拿掉，否則第二次呼叫永遠等不到事件（實測舊版會卡死）
function loadScript(src,global){return new Promise((ok,fail)=>{
  if(window[global])return ok();
  const ready=()=>window[global]?ok():fail(new Error('元件載入後仍未就緒：'+src));
  const prev=document.querySelector('script[data-lib="'+src+'"]');
  if(prev){
    if(prev.dataset.state==='ok')return ready();
    if(prev.dataset.state==='err')prev.remove();
    else{prev.addEventListener('load',ready);prev.addEventListener('error',()=>{prev.dataset.state='err';prev.remove();fail(new Error('無法載入必要元件：'+src))});return}
  }
  const el=document.createElement('script');el.src=src;el.dataset.lib=src;
  el.onload=()=>{el.dataset.state='ok';ready()};
  el.onerror=()=>{el.dataset.state='err';el.remove();fail(new Error('無法載入必要元件：'+src))};
  document.head.appendChild(el)})}

// ---- 安全：匯入／還原的 HTML 先清乾淨（docx 的連結可以是 javascript:，mammoth 會原樣輸出）----
function sanitizeHtml(html){const t=document.createElement('template');t.innerHTML=String(html==null?'':html);
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(n=>n.remove());
  const w=document.createTreeWalker(t.content,NodeFilter.SHOW_ELEMENT);let el;
  while((el=w.nextNode())){for(const a of[...el.attributes]){const n=a.name.toLowerCase(),v=a.value.replace(/[\u0000-\u0020]/g,'').toLowerCase();
    if(n.startsWith('on')||n==='srcdoc'||n==='formaction'||((n==='href'||n==='src'||n==='xlink:href')&&/^(javascript:|vbscript:|data:text\/html)/.test(v)))el.removeAttribute(a.name)}}
  return t.innerHTML}

// ---- 圖片：插入前先縮圖，避免文件、PDF 與草稿爆掉 ----
function fileToDataUrl(f){return new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>fail(new Error('讀取檔案失敗'));r.readAsDataURL(f)})}
function shrinkDataUrl(src,max=1600,q=.82){return new Promise(ok=>{const im=new Image();
  im.onload=()=>{try{const w=im.naturalWidth,h=im.naturalHeight;
    if(w<=max&&h<=max&&src.length<300000)return ok(src);
    const c=document.createElement('canvas');
    const draw=scale=>{c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
      const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return ctx};
    const k=Math.min(1,max/Math.max(w,h));let ctx=draw(k);
    // 真的用到透明才留 PNG，其餘一律轉 JPEG（照片、截圖用 PNG 會愈縮愈大）
    let alpha=false;
    try{const d=ctx.getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=68){if(d[i]<250){alpha=true;break}}}catch(e){alpha=true}
    let out=c.toDataURL(alpha?'image/png':'image/jpeg',q);
    if(!alpha&&out.length>1200000){ctx=draw(k*.7);out=c.toDataURL('image/jpeg',.7)}
    ok(out.length<src.length?out:src)   // 轉完反而變大就保留原圖
  }catch(e){ok(src)}};
  im.onerror=()=>ok(src);im.src=src})}

// ---- 工具列狀態同步（游標在哪裡，B/I/U、對齊、清單與段落樣式就顯示對應狀態）----
let stateT;
function syncToolbar(){const sel=getSelection();if(!sel.rangeCount||!editor.contains(sel.anchorNode))return;
  document.querySelectorAll('.tool[data-cmd]').forEach(b=>{const c=b.dataset.cmd;let on=false;
    if(/^(bold|italic|underline|insertUnorderedList|insertOrderedList|justify)/.test(c)){try{on=document.queryCommandState(c)}catch(e){}}
    b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')});
  let blk='p';try{blk=String(document.queryCommandValue('formatBlock')||'p').toLowerCase()}catch(e){}
  if(!blk||blk==='div')blk='p';
  const box=$('#blockStyle');if([...box.options].some(o=>o.value===blk))box.value=blk}
document.addEventListener('selectionchange',()=>{clearTimeout(stateT);stateT=setTimeout(syncToolbar,120)});

// ---- 檔名 → 分頁標題；紙張尺寸 → 列印用的 @page（原本列印會用瀏覽器預設紙張，A4 預覽跟列印不一致）----
function syncTitle(){document.title=($('#filename').value.trim()||'未命名文件')+'｜Word 文件簡易編輯器'}
const PAGE={a4:'210mm 297mm',letter:'216mm 279mm',legal:'216mm 356mm'};
function applyPageStyle(){const wh=(PAGE[$('#pageSize').value]||PAGE.a4).split(' ');
  const land=$('#orientation').value==='landscape';
  $('#pageStyle').textContent='@page{size:'+(land?wh[1]+' '+wh[0]:wh[0]+' '+wh[1])+';margin:12mm}'}

// ---- 插入內容：優先用 Range（execCommand 在沒有游標範圍時會甚麼都不做）----
function insertHtmlAtCaret(html){const sel=getSelection();
  const has=sel.rangeCount&&editor.contains(sel.getRangeAt(0).startContainer);
  if(!has){editor.insertAdjacentHTML('beforeend',html);return true}
  const r=sel.getRangeAt(0);r.deleteContents();
  const t=document.createElement('template');t.innerHTML=html;
  const frag=t.content,last=frag.lastChild;
  r.insertNode(frag);
  if(last){r.setStartAfter(last);r.collapse(true);sel.removeAllRanges();sel.addRange(r)}
  return true}

async function insertImageFile(file){if(!/^image\//.test(file.type))return msg('請選擇圖片檔。',true);
  document.body.classList.add('statusbusy');msg('正在插入圖片…');
  try{const src=await fileToDataUrl(file),small=await shrinkDataUrl(src);
    editor.focus();insertHtmlAtCaret('<img src="'+small+'" alt="">');
    saveDraft();
    msg(small.length<src.length?'已插入圖片（自動縮圖 '+Math.round(src.length/1024)+'KB → '+Math.round(small.length/1024)+'KB）':'已插入圖片');
  }catch(err){msg('插入圖片失敗：'+err.message,true)}finally{document.body.classList.remove('statusbusy')}}
$('#imgBtn').onclick=()=>$('#imageFile').click();
$('#imageFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)insertImageFile(f)};
$('#tblBtn').onclick=()=>{const a=(prompt('插入表格：列 x 欄（第一列當標題列）','3x3')||'').trim();if(!a)return;
  const m=a.match(/^(\d{1,2})\s*[x×*,]\s*(\d{1,2})$/i);if(!m)return msg('格式請像 3x3 這樣。',true);
  const rows=Math.max(1,Math.min(20,+m[1])),cols=Math.max(1,Math.min(10,+m[2]));
  let h='<table><tr>';for(let c=1;c<=cols;c++)h+='<th>欄位 '+c+'</th>';h+='</tr>';
  for(let r=1;r<rows;r++){h+='<tr>';for(let c=1;c<=cols;c++)h+='<td><br></td>';h+='</tr>'}
  editor.focus();insertHtmlAtCaret(h+'</table><p><br></p>');saveDraft();msg('已插入 '+rows+'×'+cols+' 表格')};
$('#linkBtn').onclick=()=>{const sel=getSelection(),text=sel.rangeCount?sel.toString():'';
  const url=(prompt('連結網址（http:// 或 https://）','https://')||'').trim();if(!url)return;
  if(!/^https?:\/\//i.test(url))return msg('只接受 http:// 或 https:// 開頭的網址。',true);
  editor.focus();
  if(text&&sel.rangeCount&&editor.contains(sel.anchorNode))document.execCommand('createLink',false,url);
  else insertHtmlAtCaret('<a href="'+url.replace(/"/g,'%22')+'">'+url.replace(/[<>&]/g,'')+'</a>');
  saveDraft();msg('已插入連結')};

// ---- 拖放 .docx／圖片到頁面上 ----
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files')){e.preventDefault();document.body.classList.add('dragging')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,()=>document.body.classList.remove('dragging')));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();
  if(/\.docx$/i.test(f.name))openDocx(f);
  else if(/\.doc$/i.test(f.name))msg('舊版 .doc 無法由純瀏覽器可靠解析，請先用 Word 或 LibreOffice 另存為 .docx。',true);
  else if(/^image\//.test(f.type))insertImageFile(f);
  else msg('只支援 .docx 與圖片檔。',true)});
$('.toolbar').addEventListener('mousedown',e=>{if(e.target.closest('.tool'))e.preventDefault()});$('.tools').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;editor.focus();document.execCommand(b.dataset.cmd,false,null);syncToolbar()});$('#fontSize').onchange=e=>{editor.focus();document.execCommand('fontSize',false,e.target.value)};$('#blockStyle').onchange=e=>{editor.focus();document.execCommand('formatBlock',false,e.target.value);syncToolbar()};let saveT,draftWarned=false;
function draftSlim(html){return html.replace(/<img\b[^>]*>/gi,m=>/src\s*=\s*["']?data:/i.test(m)?'<span class="img-drop">（圖片未存入草稿）</span>':m)}
function writeDraft(html){localStorage.setItem('draft',JSON.stringify({v:2,html,name:$('#filename').value,at:Date.now()}))}
// 草稿存不進去時要說清楚（舊版靜默失敗，使用者以為存好了，其實還是舊的草稿）
function saveDraft(){try{writeDraft(editor.innerHTML);draftWarned=false;
  const t=new Date();msg('已自動儲存草稿 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'))}
  catch(e){try{writeDraft(draftSlim(editor.innerHTML));if(!draftWarned){msg('草稿超過瀏覽器容量：圖片沒有存進草稿（文字已保存）。要完整保存請按「儲存 HTML」。',true);draftWarned=true}}
    catch(e2){if(!draftWarned){msg('無法自動儲存草稿（瀏覽器空間不足），請按「儲存 HTML」保存。',true);draftWarned=true}}}}
editor.oninput=()=>{msg('內容已修改，尚未儲存…');clearTimeout(saveT);saveT=setTimeout(saveDraft,800)};
$('#filename').oninput=()=>{syncTitle();clearTimeout(saveT);saveT=setTimeout(saveDraft,800)};
try{const d=JSON.parse(localStorage.getItem('draft'));if(d&&d.html){editor.innerHTML=sanitizeHtml(d.html);$('#filename').value=d.name||'未命名文件';
  msg('已還原上次的草稿'+(d.at?'（'+new Date(d.at).toLocaleString('zh-TW',{hour12:false}).slice(0,-3)+'）':''))}}catch(e){}
syncTitle();applyPageStyle();
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});
$('#newBtn').onclick=()=>{if(!confirm('清除目前內容並開新文件？未匯出的內容將遺失。'))return;try{localStorage.removeItem('draft')}catch(e){}editor.innerHTML='<h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p>';$('#filename').value='未命名文件';syncTitle();hits=[];hi=-1;$('#findList').innerHTML='';$('#findRes').classList.remove('show');notice.style.display='none';msg('已開新文件')};$('#openBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openDocx(f)};
async function openDocx(file){
  if(file.size>60*1024*1024)return msg('檔案超過 60MB，瀏覽器可能無法處理，請先簡化內容。',true);
  notice.style.display='none';document.body.classList.add('statusbusy');msg('正在解析 DOCX…');
  try{await loadScript(LIB.mammoth,'mammoth');
    const result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()},
      {styleMap:["p[style-name='Title'] => h1:fresh","p[style-name='Heading 1'] => h1:fresh","p[style-name='Heading 2'] => h2:fresh","p[style-name='Heading 3'] => h3:fresh"]});
    editor.innerHTML=sanitizeHtml(result.value||'<p></p>');   // docx 內的連結／事件屬性一律先清掉
    $('#filename').value=file.name.replace(/\.docx$/i,'');syncTitle();
    hits=[];hi=-1;$('#findList').innerHTML='';$('#findRes').classList.remove('show');
    saveDraft();
    msg(result.messages.length?'載入完成；複雜格式可能無法完整保留':'載入完成，可開始編輯',!!result.messages.length);
  }catch(err){msg('開啟失敗：'+err.message+'。若一直失敗，請確認網路可連線或改用「儲存 HTML」流程。',true)}
  finally{document.body.classList.remove('statusbusy')}};
$('#saveBtn').onclick=()=>{const title=$('#filename').value||'文件';const html='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:"Microsoft JhengHei",sans-serif;line-height:1.75;max-width:210mm;margin:20px auto;padding:18mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:6px}img{max-width:100%}</style></head><body>'+editor.innerHTML+'</body></html>';download(new Blob([html],{type:'text/html;charset=utf-8'}),title+'.html');msg('HTML 已下載')};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#pdfBtn').onclick=async()=>{document.body.classList.add('statusbusy');msg('正在產生 PDF…');editor.style.zoom='';try{await loadScript(LIB.html2pdf,'html2pdf');await html2pdf().set({margin:[12,12,12,12],filename:($('#filename').value||'文件')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:innerWidth<640?1.5:2,useCORS:true,letterRendering:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:$('#pageSize').value,orientation:$('#orientation').value},pagebreak:{mode:['css','legacy'],avoid:['tr','img','h1','h2','h3','table','pre','blockquote']}}).from(editor).save();msg('PDF 已下載（html2pdf 產生的是點陣圖，文字不可選取；需要可搜尋文字的 PDF 請用「列印」→「另存為 PDF」）')}catch(err){msg('PDF 產生失敗：'+err.message+'；可改用「列印」後選擇另存為 PDF。',true)}finally{fit();document.body.classList.remove('statusbusy')}};
function fit(){editor.style.zoom='';if(document.body.classList.contains('desk')){const w=editor.parentElement,c=getComputedStyle(w);editor.style.zoom=Math.min(1,(w.clientWidth-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight))/editor.offsetWidth)}}function setDesk(on){document.body.classList.toggle('desk',on);editor.contentEditable=!on;try{localStorage.setItem('desk',on?'1':'')}catch(e){}fit()}$('#deskToggle').onclick=()=>setDesk(true);$('#readFind').onclick=()=>$('#findToggle').click();$('#readExit').onclick=()=>setDesk(false);addEventListener('resize',fit);try{if(localStorage.getItem('desk'))setDesk(true)}catch(e){}$('#pageSize').onchange=applyPageStyle;$('#orientation').onchange=e=>{editor.classList.toggle('landscape',e.target.value==='landscape');applyPageStyle();fit()};$('#findToggle').onclick=()=>{const open=$('#findbar').style.display!=='flex';$('#findbar').style.display=open?'flex':'none';document.body.classList.toggle('finding',open);if(open){$('#findText').focus();runFind()}else{hits=[];hi=-1;if(HL){HL.delete('find');HL.delete('find-cur')}}};const BLOCK='p,h1,h2,h3,h4,h5,h6,li,td,th,blockquote,pre,div',HL=window.CSS&&CSS.highlights;let hits=[],hi=-1,isRe=false,findT;
function findPattern(q){q=q.trim();isRe=false;if(!q)return null;const k=q.lastIndexOf('/');if(q[0]==='/'&&k>1&&/^[imsu]*$/.test(q.slice(k+1))){isRe=true;return new RegExp(q.slice(1,k),q.slice(k+1)+'g')}return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(/\s+/).join('.*?'),'gi')}
function textBlocks(){const g=new Map(),w=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const b=n.parentElement.closest(BLOCK),el=b&&editor.contains(b)?b:editor;if(!g.has(el))g.set(el,{nodes:[],text:''});const x=g.get(el);x.nodes.push({n,s:x.text.length});x.text+=n.nodeValue}return[...g.values()]}
function textPos(b,i,end){for(const x of b.nodes){const e=x.s+x.n.nodeValue.length;if(i<e||end&&i===e)return[x.n,i-x.s]}const l=b.nodes[b.nodes.length-1];return[l.n,l.n.nodeValue.length]}
const esc=t=>t.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function runFind(){let re;try{re=findPattern($('#findText').value)}catch(e){hits=[];showHits('正規表達式錯誤：'+e.message);return}hits=[];if(re)textBlocks().forEach((b,bi)=>{for(const m of b.text.matchAll(re)){if(!m[0])continue;const r=document.createRange();r.setStart(...textPos(b,m.index));r.setEnd(...textPos(b,m.index+m[0].length,1));hits.push({r,m:m[0],no:bi+1,pre:b.text.slice(Math.max(0,m.index-30),m.index),post:b.text.slice(m.index+m[0].length,m.index+m[0].length+30),cut:[m.index>30,m.index+m[0].length+30<b.text.length]})}});hi=Math.min(hi,hits.length-1);showHits(re?'':'')}
const HIT_LIST_MAX=400,HIT_MARK_MAX=800;   // 上萬筆命中時不要產生上萬個 DOM 節點與 Range
function showHits(err){$('#findRes').classList.toggle('show',!!(err||$('#findText').value.trim()));
  $('#findList').innerHTML=hits.slice(0,HIT_LIST_MAX).map((h,i)=>'<button class="hit" data-i="'+i+'"><small>第 '+h.no+' 段</small>'+(h.cut[0]?'…':'')+esc(h.pre)+'<mark>'+esc(h.m)+'</mark>'+esc(h.post)+(h.cut[1]?'…':'')+'</button>').join('');
  if(HL)HL.set('find',new Highlight(...hits.slice(0,HIT_MARK_MAX).map(h=>h.r)));
  markHit(err)}
function markHit(err){$('#findCount').textContent=err||(!hits.length?'找不到符合項目':(hi<0?'共 '+hits.length+' 筆':(hi+1)+' / '+hits.length)+(hits.length>HIT_LIST_MAX?'（清單只列前 '+HIT_LIST_MAX+' 筆、標示前 '+HIT_MARK_MAX+' 筆）':''));document.querySelectorAll('.hit').forEach(b=>b.classList.toggle('cur',+b.dataset.i===hi));if(HL){if(hi<0)HL.delete('find-cur');else HL.set('find-cur',new Highlight(hits[hi].r))}}
function goHit(i){if(!hits.length)return;hi=(i+hits.length)%hits.length;const h=hits[hi];markHit();if(!HL){const sel=getSelection();sel.removeAllRanges();sel.addRange(h.r)}h.r.startContainer.parentElement.scrollIntoView({block:'center',behavior:'smooth'});const b=document.querySelector('.hit.cur');if(b)b.scrollIntoView({block:'nearest'})}
function replaceHit(h){const t=isRe?h.m.replace(findPattern($('#findText').value),$('#replaceText').value):$('#replaceText').value;h.r.deleteContents();h.r.insertNode(document.createTextNode(t))}
$('#findText').oninput=()=>{clearTimeout(findT);findT=setTimeout(()=>{hi=-1;runFind();goHit(0)},250)};$('#findText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(findT);if(!hits.length)runFind();goHit(hi+(e.shiftKey?-1:1))}};
$('#findNext').onclick=()=>goHit(hi+1);$('#findPrev').onclick=()=>goHit(hi-1);$('#findList').onclick=e=>{const b=e.target.closest('.hit');if(b)goHit(+b.dataset.i)};
editor.addEventListener('input',()=>{if($('#findbar').style.display==='flex'){clearTimeout(findT);findT=setTimeout(runFind,300)}});
$('#replaceOne').onclick=()=>{runFind();if(!hits.length)return;const i=Math.max(hi,0);replaceHit(hits[i]);saveDraft();runFind();if(hits.length)goHit(Math.min(i,hits.length-1));msg('已取代 1 處')};
$('#replaceAll').onclick=()=>{runFind();const n=hits.length;if(!n)return;hits.slice().reverse().forEach(replaceHit);saveDraft();hi=-1;runFind();msg('已取代 '+n+' 處')};
</script>
</body></html>
