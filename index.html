label="刪除列">刪列</button><button class="tool" id="colDelBtn" title="刪除游標所在的欄" aria-label="刪除欄">刪欄</button><button class="tool" id="pbBtn" title="在這裡強制換頁（列印與 Word 匯出都有效）" aria-label="插入分頁">分頁</button><button class="tool" onclick="window.print()">列印</button><button class="tool" id="logBtn">更新紀錄</button><div class="settings"><label class="chk" title="Word 檔的頁尾置中頁碼"><input type="checkbox" id="docxPageNum" checked>Word 頁碼</label><label class="chk" title="產生的 PDF 每頁下方加「第 X 頁 / 共 Y 頁」"><input type="checkbox" id="pdfPageNum" checked>PDF 頁碼</label><label class="chk" title="列印與 PDF 的邊界（公釐）">邊界<input id="marginMm" class="num" type="number" min="0" max="40" step="1" value="12">mm</label><label class="chk" title="用保版面模式匯入 .docx：帶入紙張大小與邊界、頁首頁尾、分頁、字型字級、表格欄寬"><input type="checkbox" id="fidelityImport" checked>保版面</label><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select><select id="orientation"><option value="portrait">直向</option><option value="landscape">橫向</option></select></div></div><div id="findbar" class="findbar"><input id="findText" placeholder="尋找：多個關鍵字用空格，/正則/" enterkeyhint="search"><input id="replaceText" placeholder="取代為"><button class="btn" id="replaceOne">取代</button><button class="btn" id="replaceAll">全部取代</button><div id="findRes" class="findres"><div class="findhead"><span id="findCount"></span><button class="tool" id="findPrev" title="上一筆">‹</button><button class="tool" id="findNext" title="下一筆">›</button></div><div id="findList"></div></div></div></section><div class="meta no-print"><input id="filename" class="filename" value="未命名文件"><span id="docinfo" class="docinfo"></span><span id="status" aria-live="polite">請載入 DOCX 文件，或直接開始輸入內容</span></div><article id="editor" class="paper" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="文件內容"><h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p></article></div>
<div id="updBar" class="no-print" hidden><span>有新版本可以使用</span><button class="btn primary" id="updReload">立即更新</button><button class="tool" id="updClose" aria-label="稍後再更新">✕</button></div><div id="logModal" class="no-print" hidden><div class="logbox" role="dialog" aria-modal="true" aria-labelledby="logTitle"><div class="loghead"><b id="logTitle">更新紀錄</b><button class="tool" id="logClose" aria-label="關閉">✕</button></div><div id="logBody"></div></div></div><div class="readbar no-print"><button id="readFind" class="btn">搜尋</button><button id="readExit" class="btn primary">結束閱讀</button></div>
<script>
const $ = s => document.querySelector(s),
  editor = $('#editor'),
  statusEl = $('#status'),
  notice = $('#notice');
function msg(text, warn = false) {
  statusEl.textContent = text;
  if (warn) {
    notice.textContent = text;
    notice.style.display = 'block';
  }
}
const LIB = { mammoth: 'vendor/mammoth.browser.min.js', html2pdf: 'vendor/html2pdf.bundle.min.js' };
// 載入失敗的 script 一定要從 DOM 拿掉，否則第二次呼叫永遠等不到事件（實測舊版會卡死）
function loadScript(src, global) {
  return new Promise((ok, fail) => {
    if (window[global]) return ok();
    const ready = () => (window[global] ? ok() : fail(new Error('元件載入後仍未就緒：' + src)));
    const prev = document.querySelector('script[data-lib="' + src + '"]');
    if (prev) {
      if (prev.dataset.state === 'ok') return ready();
      if (prev.dataset.state === 'err') prev.remove();
      else {
        prev.addEventListener('load', ready);
        prev.addEventListener('error', () => {
          prev.dataset.state = 'err';
          prev.remove();
          fail(new Error('無法載入必要元件：' + src));
        });
        return;
      }
    }
    const el = document.createElement('script');
    el.src = src;
    el.dataset.lib = src;
    el.onload = () => {
      el.dataset.state = 'ok';
      ready();
    };
    el.onerror = () => {
      el.dataset.state = 'err';
      el.remove();
      fail(new Error('無法載入必要元件：' + src));
    };
    document.head.appendChild(el);
  });
}

// ---- 安全：匯入／還原的 HTML 先清乾淨（docx 的連結可以是 javascript:，mammoth 會原樣輸出）----
function sanitizeHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html == null ? '' : html);
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(n => n.remove());
  const w = document.createTreeWalker(t.content, NodeFilter.SHOW_ELEMENT);
  let el;
  while ((el = w.nextNode())) {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(),
        v = a.value.replace(/[\u0000-\u0020]/g, '').toLowerCase();
      if (
        n.startsWith('on') ||
        n === 'srcdoc' ||
        n === 'formaction' ||
        ((n === 'href' || n === 'src' || n === 'xlink:href') &&
          /^(javascript:|vbscript:|data:text\/html)/.test(v))
      )
        el.removeAttribute(a.name);
    }
  }
  return t.innerHTML;
}

// ---- 圖片：插入前先縮圖，避免文件、PDF 與草稿爆掉 ----
function fileToDataUrl(f) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fail(new Error('讀取檔案失敗'));
    r.readAsDataURL(f);
  });
}
function shrinkDataUrl(src, max = 1600, q = 0.82) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.naturalWidth,
          h = im.naturalHeight;
        if (w <= max && h <= max && src.length < 300000) return ok(src);
        const c = document.createElement('canvas');
        const draw = scale => {
          c.width = Math.max(1, Math.round(w * scale));
          c.height = Math.max(1, Math.round(h * scale));
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
          return ctx;
        };
        const k = Math.min(1, max / Math.max(w, h));
        let ctx = draw(k);
        // 真的用到透明才留 PNG，其餘一律轉 JPEG（照片、截圖用 PNG 會愈縮愈大）
        let alpha = false;
        try {
          const d = ctx.getImageData(0, 0, c.width, c.height).data;
          for (let i = 3; i < d.length; i += 68) {
            if (d[i] < 250) {
              alpha = true;
              break;
            }
          }
        } catch (e) {
          alpha = true;
        }
        let out = c.toDataURL(alpha ? 'image/png' : 'image/jpeg', q);
        if (!alpha && out.length > 1200000) {
          ctx = draw(k * 0.7);
          out = c.toDataURL('image/jpeg', 0.7);
        }
        ok(out.length < src.length ? out : src); // 轉完反而變大就保留原圖
      } catch (e) {
        ok(src);
      }
    };
    im.onerror = () => ok(src);
    im.src = src;
  });
}

// ---- 插入內容：優先用 Range（execCommand 在沒有游標範圍時會甚麼都不做）----
// 插入 HTML。重點：只有「貼上」才會覆蓋選取內容；插入圖片／表格一律不動既有內容，
// 而且任何 Range 例外都要退回附加，絕不能像舊寫法那樣先刪掉內容才失敗。
function insertHtmlAtCaret(html, opts) {
  const replaceSel = !!(opts && opts.replaceSel);
  const t = document.createElement('template');
  t.innerHTML = html;
  const frag = t.content,
    last = frag.lastChild;
  const blocky = /^\s*<(p|div|table|ul|ol|h[1-6]|blockquote|pre)\b/i.test(html);
  let r = null;
  try {
    const sel = getSelection();
    if (sel.rangeCount) {
      const c = sel.getRangeAt(0);
      if (editor.contains(c.startContainer) && editor.contains(c.endContainer)) r = c.cloneRange();
    }
  } catch (e) {
    r = null;
  }
  // 插入的是整塊內容（段落／表格／清單）而且游標在某一塊裡面 → 插在那一塊後面，
  // 否則會變成 <p><p>…</p></p> 這種疊在一起的 DOM
  if (r && blocky) {
    try {
      const node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
      const host = node && node.closest ? node.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,td,th') : null;
      if (host && editor.contains(host)) {
        if (replaceSel) r.deleteContents();
        let ref = host;
        const nodes = [...frag.childNodes];
        if (replaceSel && nodes.length && !host.textContent.trim() && !host.querySelector('img,table')) {
          host.replaceWith(...nodes);
          ref = nodes[nodes.length - 1]; // 整段被取代掉就換掉它，不留空段落
        } else
          for (const n of nodes) {
            ref.after(n);
            ref = n;
          }
        const sel = getSelection();
        const rr = document.createRange();
        rr.setStartAfter(ref);
        rr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(rr);
        return true;
      }
    } catch (e) {
      /* 落回下面的插入方式 */
    }
  }
  if (r) {
    try {
      if (replaceSel) r.deleteContents();
      else r.collapse(false);
      r.insertNode(frag);
      const sel = getSelection();
      if (last) {
        const after = document.createRange();
        after.setStartAfter(last);
        after.collapse(true);
        sel.removeAllRanges();
        sel.addRange(after);
      }
      return true;
    } catch (e) {
      /* 落到下面的附加 */
    }
  }
  editor.insertAdjacentHTML('beforeend', html);
  return true;
}

async function insertImageFile(file) {
  if (!/^image\//.test(file.type)) return msg('請選擇圖片檔。', true);
  document.body.classList.add('statusbusy');

    saveDraft();
    msg(
      small.length < src.length
        ? '已插入圖片（自動縮圖 ' +
            Math.round(src.length / 1024) +
            'KB → ' +
            Math.round(small.length / 1024) +
            'KB）'
        : '已插入圖片',
    );
  } catch (err) {
    msg('插入圖片失敗：' + err.message, true);
  } finally {
    document.body.classList.remove('statusbusy');
  }
}

// 頁碼用 canvas 畫成圖再貼進 PDF：jsPDF 內建字型不含中文，直接 text() 會變亂碼或空白
function pageNumStamp(pdf, i, n) {
  const scale = 3,
    text = '第 ' + i + ' 頁 / 共 ' + n + ' 頁',
    font = 9 * scale + 'px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  const c = document.createElement('canvas'),
    m = c.getContext('2d');
  m.font = font;
  const w = Math.ceil(m.measureText(text).width) + 8 * scale,
    h = 15 * scale;
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.font = font;
  g.fillStyle = '#666';
  g.textBaseline = 'middle';
  g.fillText(text, 4 * scale, h / 2);
  const px = 25.4 / 96,
    mmW = (w / scale) * px,
    mmH = (h / scale) * px;
  const pw = pdf.internal.pageSize.getWidth(),
    ph = pdf.internal.pageSize.getHeight();
  pdf.addImage(c.toDataURL('image/png'), 'PNG', (pw - mmW) / 2, ph - mmH - 2, mmW, mmH);
}

function pageEdges(header, footer) {
  document.querySelectorAll('.pageedge').forEach(e => e.remove());
  const wrap = document.querySelector('.wrap');
  const add = (cls, html) => {

    const d = document.createElement('div');
    d.className = 'pageedge ' + cls;
    d.setAttribute('aria-hidden', 'true');
    d.innerHTML = sanitizeHtml(html);
    wrap.appendChild(d);
  };
  add('head', header);
  add('foot', footer);
}

// ---- 表格編輯：只有游標在表格內才有作用 ----
function cellOfCaret() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  const n = sel.anchorNode,
    el = n && (n.nodeType === 1 ? n : n.parentElement);
  const cell = el && el.closest ? el.closest('td,th') : null;
  return cell && editor.contains(cell) ? cell : null;
}
function tableOp(kind) {
  const cell = cellOfCaret();
  if (!cell) return msg('請先把游標放在表格內，再按表格編輯。', true);
  const table = cell.closest('table'),
    row = cell.closest('tr'),
    rows = [...table.rows];
  const hasMerged = !!table.querySelector('[colspan],[rowspan]');
  if (kind === 'addRow') {
    const clone = row.cloneNode(true);
    [...clone.children].forEach(td => {
      td.removeAttribute('rowspan');
      td.innerHTML = '<br>';
    });
    row.after(clone);
    msg('已在下方插入一列');
  } else if (kind === 'delRow') {
    if (rows.length < 2) return msg('表格至少要留一列。', true);
    row.remove();
    msg('已刪除這一列');
  } else {
    if (hasMerged) return msg('這個表格有合併儲存格，暫時不支援插入／刪除欄。', true);
    const idx = [...row.children].indexOf(cell);
    if (kind === 'delCol' && [...row.children].length < 2) return msg('表格至少要留一欄。', true);
    rows.forEach(tr => {
      const cells = [...tr.children];
      if (!cells[idx]) return;
      if (kind === 'addCol') {
        const nd = document.createElement(cells[idx].tagName === 'TH' ? 'th' : 'td');
        nd.innerHTML = '<br>';
        cells[idx].after(nd);
      } else cells[idx].remove();
    });
    msg(kind === 'addCol' ? '已在右側插入一欄' : '已刪除這一欄');
  }
  saveDraft();
}

async function openDocx(file) {
  if (file.size > 60 * 1024 * 1024) return msg('檔案超過 60MB，瀏覽器可能無法處理，請先簡化內容。', true);
  notice.style.display = 'none';

      try {
        msg('正在解析 DOCX（保版面模式）…');
        await loadScript('./docx-fidelity.js', 'docxFidelity');
        const r = await window.docxFidelity.convert(buf);
        const plain = (r && r.html ? r.html : '').replace(/<[^>]+>/g, '').trim();
        if (plain) {
          editor.innerHTML = sanitizeHtml(r.html);
          pageEdges(r.header, r.footer);
          applyDocumentPage(r.page);

          if (r.page) bits.push('紙張 ' + r.page.w + '×' + r.page.h + 'mm');

          $('#filename').value = file.name.replace(/\.docx$/i, '');
          syncTitle();
          hits = [];

            r.warnings && r.warnings.length

      const small = await shrinkDataUrl(src);
      if (small !== src) {
        saved += src.length - small.length;
        im.setAttribute('src', small);
      }
    } catch (e) {}
  }
  return saved;
}
$('#replaceOne').onclick = () => {
  runFind();
  if (!hits.length) return;
  const i = Math.max(hi, 0);
  replaceHit(hits[i]);
  saveDraft();
  runFind();
  if (hits.length) goHit(Math.min(i, hits.length - 1));
  msg('已取代 1 處');
};
$('#replaceAll').onclick = () => {
  runFind();
  const n = hits.length;
  if (!n) return;
  hits.slice().reverse().forEach(replaceHit);
  saveDraft();
  hi = -1;
  runFind();
  msg('已取代 ' + n + ' 處');
};
// Updates: changelog.json is the release record, newest first. Its top version at load is the one running; a later fetch saying otherwise means a newer deploy.
let runningVer = null,
  logReady;
const fetchLog = () =>
  fetch('./changelog.json', { cache: 'no-store' }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
function showLog(entries, title) {
  $('#logTitle').textContent = title;
  $('#logBody').replaceChildren(
    ...entries.map(e => {
      const sec = document.createElement('section'),
        h = document.createElement('h4'),
        ul = document.createElement('ul');
      h.textContent = e.version;
      ul.append(
        ...e.notes.map(n => {
          const li = document.createElement('li');
          li.textContent = n;
          return li;
        }),
      );
      sec.append(h, ul);
      return sec;
    }),
  );
  $('#logModal').hidden = false;
}
$('#logBtn').onclick = () =>
  fetchLog()
    .then(l => showLog(l, '更新紀錄'))
    .catch(() => msg('無法載入更新紀錄', true));
$('#logClose').onclick = () => {
  $('#logModal').hidden = true;
};
$('#logModal').onclick = e => {
  if (e.target.id === 'logModal') e.target.hidden = true;
};
(logReady = fetchLog())
  .then(log => {
    runningVer = log[0] && log[0].version;
    if (!runningVer) return;
    let seen = null,
      returning = false;
    try {
      seen = localStorage.getItem('seenVersion');
      returning = seen !== null || !!localStorage.getItem('draft');
    } catch (e) {}
    if (seen !== runningVer && returning) {
      const i = log.findIndex(e => e.version === seen);
      showLog(i === -1 ? log.slice(0, 1) : log.slice(0, i), '已更新到 ' + runningVer);
    }
    try {
      localStorage.setItem('seenVersion', runningVer);
    } catch (e) {}
  })
  .catch(() => {});
function checkUpdate() {
  if (!runningVer || document.hidden || !$('#updBar').hidden) return;
  fetchLog()
    .then(l => {
      if (l[0] && l[0].version !== runningVer) $('#updBar').hidden = false;
    })
    .catch(() => {});
}
document.addEventListener('visibilitychange', checkUpdate);
setInterval(checkUpdate, 30 * 60 * 1000);
$('#updReload').onclick = () => location.reload();
$('#updClose').onclick = () => {
  $('#updBar').hidden = true;
};
// Service Worker：第一次載入後即可離線開啟（DOCX 解析與 PDF 產生都已經在本機）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker
    .register('./sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(async reg => {
      try {
        const log = await logReady;
        const v = log && log[0] && log[0].version;
        if (v && reg.active) reg.active.postMessage({ version: v }); // 版本換了就讓 SW 重抓 vendor 檔案
      } catch (e) {}
    })
    .catch(() => {});
}
</script>
</body></html>
