<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word 文件簡易編輯與 PDF 轉換工具</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Word 編輯器">
<style>
:root {
  --blue: #2563eb;
  --green: #059669;
  --slate: #334155;
  --line: #dbe3ee;
  --bg: #eef2f7;
  --warn: #fffbeb;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif;
  background: var(--bg);
  color: #1e293b;
}
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px #0f172a10;
}
.topin,
.wrap {
  max-width: 1280px;
  margin: auto;
}
.topin {
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}
.logo {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--blue);
  color: white;
  display: grid;
  place-items: center;
  font-size: 23px;
}
.brand h1 {
  font-size: 18px;
  margin: 0;
}
.brand p {
  font-size: 12px;
  color: #64748b;
  margin: 3px 0 0;
}
.actions,
.tools,
.findbar,
.settings {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.btn,
.tool,
select,
input {
  font: inherit;
}
.btn {
  border: 1px solid var(--line);
  background: white;
  padding: 9px 13px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
}
.btn:hover,
.tool:hover {
  background: #f8fafc;
}
.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}
.primary:hover {
  background: #1d4ed8;
}
.pdf {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.pdf:hover {
  background: #047857;
}
.wrap {
  padding: 18px;
}
.notice {
  display: none;
  background: var(--warn);
  border: 1px solid #fde68a;
  color: #854d0e;
  padding: 11px 14px;
  border-radius: 12px;
  margin-bottom: 12px;
}
.toolbar {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 3px 12px #0f172a0c;
}
.tool {
  border: 0;
  background: white;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  min-width: 37px;
}
.sep {
  height: 28px;
  width: 1px;
  background: var(--line);
  margin: 0 3px;
}
.tools select,
.findbar input,
.filename {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: white;
}
.settings {
  margin-left: auto;
}
.findbar {
  display: none;
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 10px;
}
.findres {
  flex-basis: 100%;
  display: none;
}
.findres.show {
  display: block;
}
.findhead {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #64748b;
}
.findhead span {
  margin-right: auto;
}
#findList {
  max-height: 30vh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-top: 6px;
}
#findList:empty {
  display: none;
}
.hit {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: #fff;
  padding: 8px 10px;
  font: inherit;
  font-size: 14px;
  line-height: 1.5;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.hit:last-child {
  border-bottom: 0;
}
.hit small {
  color: #64748b;
  margin-right: 6px;
}
.hit mark {
  background: #fde68a;
  padding: 0 1px;
}
.hit.cur {
  background: #eff6ff;
}
::highlight(find) {
  background: #fde68a;
}
::highlight(find-cur) {
  background: #f59e0b;
  color: #fff;
}
.meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin: 13px auto 7px;
  max-width: 210mm;
  font-size: 12px;
  color: #64748b;
}
.filename {
  width: 320px;
  color: #1e293b;
  font-weight: 700;
}
.paper {
  width: 210mm;
  min-height: 297mm;
  margin: auto;
  background: white;
  padding: 18mm;
  box-shadow: 0 10px 30px #0f172a25;
  outline: none;
  font-family: 'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.paper.landscape {
  width: 297mm;
  min-height: 210mm;
}
.paper h1 {
  font-size: 30px;
  margin: 0.5em 0;
}
.paper h2 {
  font-size: 24px;
}
.paper .docx-txbx {
  border: 1px dashed #94a3b8;
  padding: 4px 8px;
  margin: 6px 0;
}
.paper .docx-noimg {
  display: inline-block;
  border: 1px dashed #f59e0b;
  background: #fffbeb;
  color: #92400e;
  padding: 8px;
  font-size: 12px;
}
.paper img {
  max-width: 100%;
  height: auto;
}
.paper table {
  width: 100%;
  border-collapse: collapse;
}
.paper th,
.paper td {
  border: 1px solid #94a3b8;
  padding: 6px;
  vertical-align: top; /* 跟 Word 一樣預設靠上 */
}
.statusbusy {
  opacity: 0.65;
  pointer-events: none;
}
/* 平板與電腦：頂部工具列與編輯區外框滿版；紙張本身照 Word 頁面大小分頁顯示 */
@media screen and (min-width: 641px) {
  body:not(.desk) .topin,
  body:not(.desk) .wrap,
  body:not(.desk) .meta {
    max-width: none;
  }
}
/* 分頁檢視（平板與電腦）：分頁符號不再畫虛線，由頁與頁之間的空隙表現 */
@media screen {
  body.paged .pagebreak {
    border: 0;
    margin: 0;
  }
  body.paged .pagebreak::after {
    content: none;
  }
}
/* 圖片：點選後外框＋小工具列；拖曳時的插入位置線 */
.imgselbox {
  position: fixed;
  z-index: 59;
  border: 2px solid var(--blue);
  border-radius: 2px;
  pointer-events: none;
}
.imgselbox i {
  position: absolute;
  width: 14px;
  height: 14px;
  background: #fff;
  border: 2px solid var(--blue);
  border-radius: 3px;
  pointer-events: auto;
  touch-action: none;
}
.imgselbox i[data-c='nw'] { left: -8px; top: -8px; cursor: nwse-resize; }
.imgselbox i[data-c='ne'] { right: -8px; top: -8px; cursor: nesw-resize; }
.imgselbox i[data-c='sw'] { left: -8px; bottom: -8px; cursor: nesw-resize; }
.imgselbox i[data-c='se'] { right: -8px; bottom: -8px; cursor: nwse-resize; }
.imgsize {
  position: absolute;
  right: 4px;
  bottom: 4px;
  background: #1e293bcc;
  color: #fff;
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 4px;
}
.imgbar {
  position: fixed;
  z-index: 60;
  display: flex;
  gap: 2px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  box-shadow: 0 4px 14px #0f172a26;
}
.imgbar .tool {
  min-width: 34px;
  padding: 6px 8px;
  font-size: 13px;
}
.dropcaret {
  position: fixed;
  z-index: 61;
  width: 2px;
  background: var(--blue);
  pointer-events: none;
}
/* 跨頁表格標題列的複本（分頁檢視） */
.paper.pgclone {
  position: absolute;
  z-index: 6;
  width: auto;
  min-height: 0 !important;
  padding: 0 !important;
  margin: 0;
  box-shadow: none !important;
  background: #fff;
  pointer-events: none;
  transform-origin: 0 0;
}
/* 儲存格底色：色盤藏在「底色」按鈕後面 */
.cellbg {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.cellbg input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
/* 文字顏色與螢光：跟「底色」一樣，真正的 <input type=color> 蓋在按鈕上，眼睛看到的是色塊 */
.colorbtn,
.hlmenu > summary {
  position: relative;
}
.colorbtn input,
.hlpanel .hlcustom input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.colorbtn b {
  border-bottom: 3px solid var(--sw, #d92b2b);
  line-height: 1.15;
}
.sw {
  width: 15px;
  height: 15px;
  flex: none;
  border-radius: 3px;
  border: 1px solid #00000040;
  background: var(--sw, #ffff00);
}
.hlpanel {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-width: 196px;
  padding: 6px;
}
.hlpanel .mi {
  flex: 1 1 auto;
  justify-content: flex-start;
}
.hlpanel .hlcustom {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
}
/* 表格工具那一組自己就比整條工具列寬（桌機 1200px 會爆出容器，右邊的內距／刪除表格根本按不到）
   → 桌機（≥1280，跟文字標籤同一個斷點）讓它跟復原／重做共用一列、必要時內部換行；
   窄一點與手機維持整條橫向捲動（不要變成好幾列高） */
@media (min-width: 1280px) {
  body.intable .grp.tblgrp {
    flex: 1 1 auto;   /* 跟「復原／重做」共用一列，空間不夠時自己換行 */
    min-width: 0;
    flex-wrap: wrap;
    row-gap: 5px;
  }
}
/* 框線選單上方的樣式／粗細／顏色 */
.bdopts {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 4px 6px 8px;
}
.bdopts input[type='color'] {
  width: 34px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
}
/* 內距選單 */
.padopts {
  display: grid;
  grid-template-columns: repeat(2, auto);
  gap: 6px 10px;
  padding: 4px 6px 8px;
  align-items: center;
}
.padopts label {
  display: flex;
  gap: 4px;
  align-items: center;
  font-size: 13px;
}
.padopts input {
  width: 64px;
}
.padunit {
  font-size: 12px;
  color: #64748b;
}
/* 斜線表頭的文字：可拖曳調整位置 */
.paper td[data-diag] p {
  cursor: move;
}
/* Word 常見的中文編號（匯入時對應到這些 list-style-type） */
/* 舊版匯入用過的名稱（草稿裡可能還有）；其餘格式由 script 產生 tw-<格式>-<前後綴> */
@counter-style tw-han-paren {
  system: extends trad-chinese-informal;
  prefix: '（';
  suffix: '）';
}
@counter-style tw-dec-paren {
  system: extends decimal;
  prefix: '(';
  suffix: ') ';
}
@counter-style tw-circled {
  system: fixed;
  symbols: '①' '②' '③' '④' '⑤' '⑥' '⑦' '⑧' '⑨' '⑩' '⑪' '⑫' '⑬' '⑭' '⑮' '⑯' '⑰' '⑱' '⑲' '⑳';
  suffix: ' ';
}
/* 滑鼠移到工具按鈕上立即顯示說明（瀏覽器原生 title 要等約一秒，觸控裝置也不顯示） */
.tip {
  position: fixed;
  z-index: 100;
  pointer-events: none;
  background: #1e293b;
  color: #fff;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 平板與電腦：編輯工具列固定在頁首下方，不跟著捲動 */
@media screen and (min-width: 641px) and (min-height: 501px) {
  body:not(.desk) .toolbar {
    position: sticky;
    top: var(--toph, 0px);
    z-index: 9;
  }
}
@media (max-width: 900px) {
  .topin {
    align-items: flex-start;
    flex-direction: column;
  }
  .settings {
    margin-left: 0;
  }
  .paper,
  .paper.landscape {
    width: 100%;
    min-height: 70vh;
    padding: 28px;
  }
  .meta {
    max-width: none;
  }
}
@media (max-width: 640px) {
  .topin {
    padding: 8px 12px;
    gap: 8px;
    flex-direction: row;
    align-items: center;
  }
  .actions {
    flex: 1;
  }
  .actions .btn {
    flex: 1;
  }
  .logo {
    width: 36px;
    height: 36px;
    font-size: 19px;
  }
  .actions {
    flex-wrap: nowrap;
    gap: 6px;
  }
  .btn {
    padding: 10px 8px;
    min-height: 42px;
    white-space: nowrap;
    font-size: 14px;
  }
  .wrap {
    padding: 8px;
  }
  .toolbar {
    position: sticky;
    top: 57px;
    z-index: 9;
    padding: 6px;
    border-radius: 12px;
  }
  .tools {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tools::-webkit-scrollbar {
    display: none;
  }
  .tool,
  .tools select {
    flex: none;
    min-height: 42px;
    min-width: 42px;
  }
  .settings {
    display: flex;
    flex-wrap: nowrap;
  }
  .findbar input {
    flex: 1 1 40%;
    min-width: 0;
  }
  .meta {
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    margin: 8px 0;
  }
  .filename {
    width: 100%;
  }
  .paper,
  .paper.landscape {
    padding: 16px;
    min-height: 60vh;
    box-shadow: 0 4px 14px #0f172a20;
  }
  .paper h1 {
    font-size: 24px;
  }
  .paper h2 {
    font-size: 20px;
  }
  .paper table {
    display: block;
    overflow-x: auto;
  }
}
input,
select {
  font-size: 16px;
}
body.desk .paper {
  width: 210mm;
  min-height: 297mm;
  padding: 18mm;
}
body.desk .paper.landscape {
  width: 297mm;
  min-height: 210mm;
}
body.desk:not(.finding) .toolbar,
body.desk .tools,
body.desk #replaceText,
body.desk #replaceOne,
body.desk #replaceAll,
body.desk .meta,
body.desk .notice {
  display: none !important;
}
body.desk .findbar {
  border: 0;
  margin: 0;
  padding: 0;
}
.readbar {
  display: none;
  gap: 8px;
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 20;
}
.readbar .btn {
  box-shadow: 0 4px 14px #0f172a40;
}
body.desk .readbar {
  display: flex;
}
#updBar,
#shareBar {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 14px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 20px #0f172a30;
  white-space: nowrap;
  max-width: calc(100vw - 24px);
}
#updBar[hidden],
#shareBar[hidden],
#logModal[hidden] {
  display: none;
}
#logModal {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #0f172a80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.logbox {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 480px;
  max-height: 80vh;
  overflow: auto;
  box-shadow: 0 10px 30px #0f172a40;
}
.loghead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 12px 12px 18px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: #fff;
}
#logBody {
  padding: 14px 18px 18px;
}
#logBody h4 {
  margin: 0 0 6px;
}
#logBody section + section {
  margin-top: 14px;
}
#logBody ul {
  margin: 0;
  padding-left: 1.2em;
  line-height: 1.6;
}
.tool.on {
  background: #dbeafe;
  border-color: #93c5fd;
  color: #1d4ed8;
}
/* 複製格式（格式刷）已複製時：游標變十字，選取範圍也染色，提示「接下來是刷的動作」 */
body.painting #editor {
  cursor: crosshair;
}
body.painting #editor::selection,
body.painting #editor ::selection {
  background: rgba(99, 102, 241, 0.3);
}
body.dragging .paper {
  outline: 3px dashed var(--blue);
  outline-offset: 4px;
}
.img-drop {
  color: #94a3b8;
  font-size: 13px;
}
.chk {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--slate);
  white-space: nowrap;
}
.chk input[type='checkbox'] {
  margin: 0;
}
.docinfo {
  display: block;
  font-size: 12px;
  color: #64748b;
  margin-top: 2px;
}
.pageedge {
  display: none;
}
.paper ul,
.paper ol {
  margin: 0.4em 0;
  padding-left: 2em;
}
.paper li {
  margin: 0.15em 0;
}
.paper blockquote {
  margin: 0.6em 0;
  padding-left: 1em;
  border-left: 3px solid var(--line);
  color: #475569;
}
.paper td.vcont {
  border-top: 0;
}
@media print {
  .pageedge {
    display: block;
    position: fixed;
    left: 0;
    right: 0;
    font-size: 10pt;
    color: #333;
    z-index: 1;
  }
  .pageedge.head {
    top: 0;
    border-bottom: 0.5pt solid #bbb;
    padding-bottom: 2mm;
  }
  .pageedge.foot {
    bottom: 0;
    border-top: 0.5pt solid #bbb;
    padding-top: 1.5mm;
  }
}
.num {
  width: 56px;
  text-align: right;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px;
  background: #fff;
}
.paper .subtitle {
  color: #64748b;
  font-size: 18px;
  margin: 0.2em 0 1em;
}
.pagebreak {
  height: 0;
  margin: 14px 0;
  border-top: 2px dashed #cbd5e1;
}
.pagebreak::after {
  content: '分頁';
  position: relative;
  top: -11px;
  left: 6px;
  font-size: 11px;
  color: #94a3b8;
  background: #fff;
  padding: 0 4px;
}
.paper .caption {
  color: #64748b;
  font-size: 14px;
  text-align: center;
}
.paper th {
  background: #f1f5f9;
}
@media print {
  body.dragging .paper {
    outline: 0;
  }
}
@media print {
  .pagebreak {
    border: 0;
    margin: 0;
    break-after: page;
    page-break-after: always;
  }
  .pagebreak::after {
    content: none;
  }
}
@media print {
  body {
    background: white;
  }
  .no-print {
    display: none !important;
  }
  .wrap {
    padding: 0;
  }
  .paper,
  .paper.landscape {
    zoom: 1 !important;
    box-shadow: none;
    margin: 0;
    width: auto;
    min-height: auto;
    padding: 0;
  }
}
/* PDF 匯出的頁面（pdf-export.js）：固定紙張版面，不吃手機版的縮排、表格捲動與字級 */
.paper.pdfpage {
  min-height: 0;
  padding: 0;
  margin: 0;
  box-shadow: none;
  zoom: 1;
}
.paper.pdfpage table {
  display: table;
}

/* 手機直向，以及觸控裝置橫向（高度很矮）：工具列固定在底部、跟著鍵盤，拇指好按；尋找列開在工具列上方 */
@media (max-width: 640px), (pointer: coarse) and (max-height: 500px) {
  /* 手機：不用橫向捲動，改成折成兩列；不常用的群組收進「更多▾」面板 */
  .tools {
    flex-wrap: wrap;
    row-gap: 4px;
  }
  .grp.grp-text {
    /* 手機的文字組只有字級與粗斜底，寬度夠；窄一點的手機仍可自己折行 */
    flex: 0 1 auto;
    min-width: 0;
    flex-wrap: wrap;
  }
  /* 「更多」面板：關著的時候一定不要顯示（作者樣式會蓋掉瀏覽器預設的隱藏行為） */
  .tools > .moremenu > .panel {
    display: none;
  }
  .tools > .moremenu[open] > .panel {
    display: flex;
  }
  .moremenu > .panel .grp {
    flex-wrap: wrap;
    padding-left: 0;
    border-left: 0;
  }
  /* 面板裡放的是「更多」的長尾功能，給它寬一點比較好按（位置由 placeMenu 夾在畫面內） */
  .tools > .moremenu > .panel {
    min-width: min(80vw, 330px);

    width: 100%;
    padding: 4px 2px 2px;
    font-size: 12px;
    color: #64748b;

  .tools select {
    flex: none;
    min-height: 42px;
    min-width: 42px;
  }
  .toolbar {
    position: fixed;
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;

    flex-direction: column-reverse;
    border-radius: 14px 14px 0 0;

  }
  .grp {
    padding-left: 4px;
  }

  .findbar {
    display: none;
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-areas:
      'list list list'
      'count count count'
      'find prev next'
      'rep one all';
    gap: 6px;
    align-items: center;
  }
  #findbar[style*='flex'] {
    display: grid !important;
  }
  .findres.show,

    display: contents;

  .findbar input {
    min-width: 0;

  }
  #findText {

  }
  #replaceText {
    grid-area: rep;
  }
  #replaceOne {
    grid-area: one;
  }
  #replaceAll {
    grid-area: all;
  }
  #findPrev {
    grid-area: prev;
  }
  #findNext {
    grid-area: next;
  }
  #findCount {
    grid-area: count;
    margin: 0;
    font-size: 12px;
    color: #64748b;
  }
  #findList {
    grid-area: list;
    max-height: 22vh;
    margin: 0;
  }
  #findPrev,
  #findNext {
    min-width: 42px;
    min-height: 40px;
    font-size: 20px;
    border: 1px solid var(--line);
  }
  .findbar .btn {
    min-height: 40px;
    padding: 8px 10px;
  }
}
.menu .panel {

@media (max-width: 640px), (pointer: coarse) and (max-height: 500px) {

  }

<script>
const $ = s => document.querySelector(s),
  editor = $('#editor'),
  statusEl = $('#status'),
  notice = $('#notice');
// 最近一次「動作訊息」的時間：自動存檔完成時若剛顯示過別的訊息，就不要蓋掉它
let msgAt = 0;
function msg(text, warn = false) {
  msgAt = Date.now();
  statusEl.textContent = text;
  if (warn) {
    notice.textContent = text;
    notice.style.display = 'block';
  }
}
const LIB = { mammoth: 'vendor/mammoth.browser.min.js', html2pdf: 'vendor/html2pdf.bundle.min.js' };
// 載入失敗的 script 一定要從 DOM 拿掉，否則第二次呼叫永遠等不到事件（實測舊版會卡死）
function loadScript(src, global) {
  return new Promise((ok, fail) => {
    if (window[global]) return ok();
    const ready = () => (window[global] ? ok() : fail(new Error('元件載入後仍未就緒：' + src)));
    const prev = document.querySelector('script[data-lib="' + src + '"]');
    if (prev) {
      if (prev.dataset.state === 'ok') return ready();
      if (prev.dataset.state === 'err') prev.remove();
      else {
        prev.addEventListener('load', ready);
        prev.addEventListener('error', () => {
          prev.dataset.state = 'err';
          prev.remove();
          fail(new Error('無法載入必要元件：' + src));
        });
        return;
      }
    }
    const el = document.createElement('script');
    el.src = src;
    el.dataset.lib = src;
    el.onload = () => {
      el.dataset.state = 'ok';
      ready();
    };
    el.onerror = () => {
      el.dataset.state = 'err';
      el.remove();
      fail(new Error('無法載入必要元件：' + src));
    };
    document.head.appendChild(el);
  });
}

// ---- 安全：匯入／還原的 HTML 先清乾淨（docx 的連結可以是 javascript:，mammoth 會原樣輸出）----
function sanitizeHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = String(html == null ? '' : html);
  cleanNode(t.content);
  return t.innerHTML;
}
// <template> 的內容放在自己的 content fragment，querySelectorAll／TreeWalker 都不會走進去，
// 所以每一層都要各自清（否則 <template><img onerror=…></template> 會原封不動留下來）
function cleanNode(root) {
  // 純文字元素（plaintext／xmp／title…）的子節點對 TreeWalker 是不透明的，別讓它們混進編輯區：
  // 序列化時內容會原樣吐出來，等於有 markup 沒被檢查到
  root.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form,plaintext,xmp,noembed,noframes,title,textarea').forEach(n => n.remove());
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  const nested = [];
  const remoteImgs = [];
  let el;
  while ((el = w.nextNode())) {
    // SVG／MathML 命名空間下的 <template> 沒有 .content（只有 HTML 的才有），不能直接往下遞迴
    if (el.localName === 'template' && el.content) nested.push(el);
    let droppedSrc = false;
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(),
        v = a.value.replace(/[\u0000-\u0020]/g, '').toLowerCase();
      if (
        n.startsWith('on') ||
        n === 'srcdoc' ||
        n === 'formaction' ||
        n === 'id' || // 匯入的內容不可以搶走 App 自己的 id（#updBar／#logModal 之類）
        ((n === 'href' || n === 'src' || n === 'xlink:href') &&
          /^(javascript:|vbscript:|data:text\/html)/.test(v)) ||
        (n === 'style' && /url\s*\(|@import/i.test(a.value))
      ) {
        el.removeAttribute(a.name);
        continue;
      }
      // 圖片（含 srcset／poster／background）只接受文件自己帶進來的內容（data:／blob:）。
      // 來源不明的遠端網址會讓瀏覽器主動連到對方伺服器：洩漏 IP，也等於回報「這份文件被打開了」，
      // 跟這個工具「檔案不離開瀏覽器」的承諾相反。
      if (
        (n === 'src' || n === 'srcset' || n === 'poster' || n === 'background' || n === 'xlink:href') &&
        v &&
        !/^(data:image\/|blob:)/.test(v)
      ) {
        el.removeAttribute(a.name);
        droppedSrc = true;
      }
    }
    if (droppedSrc) remoteImgs.push(el);
  }
  // 有圖被擋掉就留一行說明，免得使用者以為文件原本就沒有圖
  for (const n of remoteImgs)
    if (n.localName === 'img' && !n.getAttribute('src')) {
      const ph = document.createElement('span');
      ph.className = 'docx-noimg';
      ph.textContent = '〔站外圖片已略過：來源不在文件內〕';
      n.replaceWith(ph);
    }
  // 文字裡的 XML 不合法控制字元：U+000B／U+000C（Word／Excel 複製出來的軟換行）換成 <br> 保留換行，
  // 其餘（NUL、BEL…）直接丟掉。留著會讓匯出的 .docx 變成非 well-formed 的 XML。
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const texts = [];
  let tn;
  while ((tn = tw.nextNode())) if (/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(tn.nodeValue)) texts.push(tn);
  for (const node of texts) {
    const frag = document.createDocumentFragment();
    node.nodeValue.split(/[\u000B\u000C]/).forEach((part, i) => {
      if (i) frag.appendChild(document.createElement('br'));
      const s = part.replace(/[\u0000-\u0008\u000E-\u001F]/g, '');
      if (s) frag.appendChild(document.createTextNode(s));
    });
    node.replaceWith(frag);
  }
  nested.forEach(t => cleanNode(t.content));
}

// ---- 圖片：插入前先縮圖，避免文件、PDF 與草稿爆掉 ----
function fileToDataUrl(f) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fail(new Error('讀取檔案失敗'));
    r.readAsDataURL(f);
  });
}
function shrinkDataUrl(src, max = 1600, q = 0.82) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.naturalWidth,
          h = im.naturalHeight;
        if (w <= max && h <= max && src.length < 300000) return ok(src);
        const c = document.createElement('canvas');
        const draw = scale => {
          c.width = Math.max(1, Math.round(w * scale));
          c.height = Math.max(1, Math.round(h * scale));
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(im, 0, 0, c.width, c.height);
          return ctx;
        };
        const k = Math.min(1, max / Math.max(w, h));
        let ctx = draw(k);
        // 真的用到透明才留 PNG，其餘一律轉 JPEG（照片、截圖用 PNG 會愈縮愈大）
        let alpha = false;
        try {
          const d = ctx.getImageData(0, 0, c.width, c.height).data;
          for (let i = 3; i < d.length; i += 68) {
            if (d[i] < 250) {
              alpha = true;
              break;
            }
          }
        } catch (e) {
          alpha = true;
        }
        let out = c.toDataURL(alpha ? 'image/png' : 'image/jpeg', q);
        if (!alpha && out.length > 1200000) {
          ctx = draw(k * 0.7);
          out = c.toDataURL('image/jpeg', 0.7);
        }
        ok(out.length < src.length ? out : src); // 轉完反而變大就保留原圖
      } catch (e) {
        ok(src);
      }
    };
    im.onerror = () => ok(src);
    im.src = src;
  });
}

// ---- 插入內容：優先用 Range（execCommand 在沒有游標範圍時會甚麼都不做）----
// 插入 HTML。重點：只有「貼上」才會覆蓋選取內容；插入圖片／表格一律不動既有內容，
// 而且任何 Range 例外都要退回附加，絕不能像舊寫法那樣先刪掉內容才失敗。
// ---- 復原／重做：自己記快照 ----
// 瀏覽器內建的復原只認得打字與 execCommand；插入表格、增刪列欄、分頁、取代這些直接改 DOM 的動作
// 都不在它的紀錄裡（按復原沒反應）。所以全部改用快照：打字停頓 0.6 秒記一筆，程式編輯前後各記一筆。
// 復原紀錄：一筆就是整份 innerHTML（含圖片的 data: URL）。圖片多的文件一筆就可能好幾 MB，
// 只按筆數上限留 100 筆會吃掉數百 MB 記憶體（實測 2.3MB 的文件 × 31 筆 ≈ 142MB），手機分頁會直接掛掉，
// 所以另外設總字數上限，並至少保留 HIST_KEEP 筆讓「復原」還有層數可用。
const HIST_MAX = 100,
  HIST_CHARS = 16000000,
  HIST_KEEP = 2;
function histChars() {
  let n = 0;
  for (const e of hist) n += e.h.length;
  return n;
}
let hist = [],
  histI = -1,
  histT;
function selPath() {
  const sel = getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode) || sel.anchorNode === editor) return null;
  const path = [];
  for (let x = sel.anchorNode; x !== editor; x = x.parentNode) path.unshift([...x.parentNode.childNodes].indexOf(x));
  return { path, off: sel.anchorOffset };
}
function setSelPath(p) {
  try {
    let n = editor;
    for (const i of p.path) n = n.childNodes[i];
    const r = document.createRange();
    r.setStart(n, Math.min(p.off, n.nodeType === 3 ? n.length : n.childNodes.length));
    r.collapse(true);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  } catch (e) {}
}
function snap() {
  clearTimeout(histT);
  const h = editor.innerHTML,
    cur = hist[histI];
  if (cur && cur.h === h) {
    cur.sel = selPath() || cur.sel;
    return;
  }
  hist = hist.slice(0, histI + 1);
  hist.push({ h, sel: selPath() });
  let total = histChars();
  while (hist.length > HIST_MAX || (hist.length > HIST_KEEP && total > HIST_CHARS)) {
    total -= hist[0].h.length;
    hist.shift();
  }
  histI = hist.length - 1;
}
function resetHistory() {
  hist = [];
  histI = -1;
  snap();
}
// 程式直接改內容時用它包起來：前後各記一筆，復原就能回到改之前
function recordEdit(fn) {
  snap();
  const r = fn();
  snap();
  saveDraft();
  return r;
}
function histGo(d) {
  snap();
  const j = histI + d;
  if (j < 0 || j >= hist.length) return msg(d < 0 ? '沒有可以復原的動作' : '沒有可以重做的動作');
  histI = j;
  selectImg(null); // 內容整個換掉，原本選取的圖片已不存在
  editor.innerHTML = hist[j].h;
  editor.focus();
  if (hist[j].sel) setSelPath(hist[j].sel);
  saveDraft();
  if ($('#findbar').style.display === 'flex') runFind();
  msg(d < 0 ? '已復原' : '已重做');
}
editor.addEventListener('input', () => {
  clearTimeout(histT);
  histT = setTimeout(snap, 600);
});
// 換段與換行（跟 Word 一樣）：Enter＝新段落（<p>，不是瀏覽器預設的 <div>），Shift+Enter＝段落內換行（<br>，匯出成 Word 的換行）
try {
  document.execCommand('defaultParagraphSeparator', false, 'p');
} catch (e) {}
editor.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.shiftKey) {
    e.preventDefault();
    document.execCommand('insertLineBreak');
    return;
  }
  // 儲存格裡直接是文字（沒有段落）時瀏覽器只會插 <br>：先把內容包成段落，再照常分段
  const sel = getSelection();
  if (!sel.rangeCount) return;
  const n = sel.anchorNode,
    el = n && (n.nodeType === 1 ? n : n.parentElement),
    blk = el && el.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,div,td,th');
  if (!blk || !/^T[DH]$/.test(blk.tagName) || !editor.contains(blk)) return;
  e.preventDefault();
  const off = sel.anchorOffset,
    p = document.createElement('p');
  while (blk.firstChild) p.appendChild(blk.firstChild);
  blk.appendChild(p);
  const r = document.createRange();
  r.setStart(n === blk ? p : n, off);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
  document.execCommand('insertParagraph');
});
editor.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'z' || k === 'y') {
    e.preventDefault();
    histGo(k === 'y' || e.shiftKey ? 1 : -1);
  }
});
// 手機的復原手勢、右鍵選單的「復原」會走 beforeinput
editor.addEventListener('beforeinput', e => {
  if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
    e.preventDefault();
    histGo(e.inputType === 'historyUndo' ? -1 : 1);
  }

function insertHtmlAtCaret(html, opts) {
  return recordEdit(() => insertHtmlAtCaretRaw(html, opts));
}
function insertHtmlAtCaretRaw(html, opts) {
  const replaceSel = !!(opts && opts.replaceSel);
  const t = document.createElement('template');
  t.innerHTML = html;
  const frag = t.content,
    last = frag.lastChild;
  const blocky = /^\s*<(p|div|table|ul|ol|h[1-6]|blockquote|pre)\b/i.test(html);
  let r = null;
  try {
    const sel = getSelection();
    if (sel.rangeCount) {
      const c = sel.getRangeAt(0);
      if (editor.contains(c.startContainer) && editor.contains(c.endContainer)) r = c.cloneRange();
    }
  } catch (e) {
    r = null;
  }
  // 插入的是整塊內容（段落／表格／清單）而且游標在某一塊裡面 → 插在那一塊後面，
  // 否則會變成 <p><p>…</p></p> 這種疊在一起的 DOM
  if (r && blocky) {
    try {
      const node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
      const host = node && node.closest ? node.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,td,th') : null;
      if (host && editor.contains(host)) {
        if (replaceSel) r.deleteContents();
        let ref = host;
        const nodes = [...frag.childNodes];
        if (replaceSel && nodes.length && !host.textContent.trim() && !host.querySelector('img,table')) {
          host.replaceWith(...nodes);
          ref = nodes[nodes.length - 1]; // 整段被取代掉就換掉它，不留空段落
        } else
          for (const n of nodes) {
            ref.after(n);
            ref = n;
          }
        const sel = getSelection();
        const rr = document.createRange();
        rr.setStartAfter(ref);
        rr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(rr);
        return true;
      }
    } catch (e) {
      /* 落回下面的插入方式 */
    }
  }
  if (r) {
    try {
      if (replaceSel) r.deleteContents();
      else r.collapse(false);
      r.insertNode(frag);
      const sel = getSelection();
      if (last) {
        const after = document.createRange();
        after.setStartAfter(last);
        after.collapse(true);
        sel.removeAllRanges();
        sel.addRange(after);
      }
      return true;
    } catch (e) {
      /* 落到下面的附加 */
    }
  }
  editor.insertAdjacentHTML('beforeend', html);
  return true;
}

async function insertImageFile(file) {
  if (!/^image\//.test(file.type)) return msg('請選擇圖片檔。', true);

  try {
    const src = await fileToDataUrl(file),
      small = await shrinkDataUrl(src);
    editor.focus();
    insertHtmlAtCaret('<img src="' + small + '" alt="">');
    saveDraft();
    msg(
      small.length < src.length
        ? '已插入圖片（自動縮圖 ' +
            Math.round(src.length / 1024) +
            'KB → ' +
            Math.round(small.length / 1024) +
            'KB）'
        : '已插入圖片',
    );
  } catch (err) {
    msg('插入圖片失敗：' + err.message, true);
  } finally {
    document.body.classList.remove('statusbusy');
  }
}

// ---- 保版面匯入：頁首／頁尾（列印時每頁重複）與文件自己的紙張設定 ----
// 頁碼用 canvas 畫成圖再貼進 PDF：jsPDF 內建字型不含中文，直接 text() 會變亂碼或空白
function pageNumStamp(pdf, i, n) {
  const scale = 3,
    text = '第 ' + i + ' 頁 / 共 ' + n + ' 頁',
    font = 9 * scale + 'px "Microsoft JhengHei","Noto Sans TC",sans-serif';
  const c = document.createElement('canvas'),
    m = c.getContext('2d');
  m.font = font;
  const w = Math.ceil(m.measureText(text).width) + 8 * scale,
    h = 15 * scale;
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.font = font;
  g.fillStyle = '#666';
  g.textBaseline = 'middle';
  g.fillText(text, 4 * scale, h / 2);
  const px = 25.4 / 96,
    mmW = (w / scale) * px,
    mmH = (h / scale) * px;
  const pw = pdf.internal.pageSize.getWidth(),
    ph = pdf.internal.pageSize.getHeight();
  pdf.addImage(c.toDataURL('image/png'), 'PNG', (pw - mmW) / 2, ph - mmH - 2, mmW, mmH);
}

// ---- 表格編輯：只有游標在表格內才有作用 ----
function cellOfCaret() {
  const sel = getSelection();
  if (!sel.rangeCount) return null;
  const n = sel.anchorNode,
    el = n && (n.nodeType === 1 ? n : n.parentElement);
  const cell = el && el.closest ? el.closest('td,th') : null;
  return cell && editor.contains(cell) ? cell : null;
}
// 表格展開成格線：grid[r][c] = 蓋住這一格的儲存格（合併儲存格會出現在多個位置）
function tableGrid(table) {
  const rows = [...table.rows],
    grid = rows.map(() => []);
  rows.forEach((tr, r) => {
    let c = 0;
    for (const td of tr.cells) {
      while (grid[r][c]) c++;
      for (let i = 0; i < td.rowSpan && r + i < rows.length; i++)
        for (let j = 0; j < td.colSpan; j++) grid[r + i][c + j] = td;
      c += td.colSpan;
    }
  });
  return { rows, grid, cols: Math.max(0, ...grid.map(g => g.length)) };
}
const newCell = like => {
  const nd = document.createElement(like && like.tagName === 'TH' ? 'th' : 'td');
  nd.innerHTML = '<br>';
  return nd;
};
// 在第 r 列、第 c 格線欄的位置插入儲存格（插在它左邊最近一個「從這一列開始」的格子後面）
function placeCell(tr, grid, r, c, nd) {
  for (let k = c - 1; k >= 0; k--) {
    const td = grid[r][k];
    if (td && td.parentElement === tr) return td.after(nd);
  }
  tr.prepend(nd);
}

  const { rows, grid, cols } = tableGrid(table);
  const r = rows.indexOf(cell.parentElement),
    c = grid[r].indexOf(cell);
  const colgroup = table.querySelector(':scope > colgroup');
  const colEls = colgroup ? [...colgroup.children] : [];

// 儲存格垂直對齊：套用到選取範圍涵蓋的所有格子（沒選取就是游標那一格）；靠上是預設，就清掉設定
// 選取的儲存格：以選取起點與終點所在的格子圍出格線矩形（像 Word 一樣是方塊，不是閱讀順序經過的格子），
// 合併儲存格跨出矩形時把矩形撐大；Firefox 的多段格子選取也一併算進來
function selCells() {
  const cell = cellOfCaret();
  if (!cell) return null;
  const table = cell.closest('table'),
    { grid } = tableGrid(table),
    sel = getSelection();
  const at = n => {
    const el = n && (n.nodeType === 1 ? n : n.parentElement),
      td = el && el.closest('td,th');
    return td && td.closest('table') === table ? td : null;
  };
  const ends = [];
  for (let i = 0; i < sel.rangeCount; i++) {
    const r = sel.getRangeAt(i);
    ends.push(at(r.startContainer.nodeType === 1 ? r.startContainer.childNodes[r.startOffset] || r.startContainer : r.startContainer));
    ends.push(at(r.endContainer.nodeType === 1 ? r.endContainer.childNodes[Math.max(0, r.endOffset - 1)] || r.endContainer : r.endContainer));
  }
  const pos = td => {
    let b = null;
    grid.forEach((row, r) => row.forEach((x, c) => {
      if (x !== td) return;
      b = b ? [Math.min(b[0], r), Math.min(b[1], c), Math.max(b[2], r), Math.max(b[3], c)] : [r, c, r, c];
    }));
    return b;
  };
  let box = null;
  for (const td of ends.filter(Boolean)) {
    const b = pos(td);
    if (b) box = box ? [Math.min(box[0], b[0]), Math.min(box[1], b[1]), Math.max(box[2], b[2]), Math.max(box[3], b[3])] : b;
  }

          box = [Math.min(box[0], b[0]), Math.min(box[1], b[1]), Math.max(box[2], b[2]), Math.max(box[3], b[3])];

const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
function applyBorders(kind, cells) {
  const table = cells[0].closest('table'),
    { grid } = tableGrid(table),
    box = new Map();
  grid.forEach((row, r) =>
    row.forEach((td, c) => {
      const b = box.get(td) || { r0: r, c0: c, r1: r, c1: c };
      Object.assign(b, { r0: Math.min(b.r0, r), c0: Math.min(b.c0, c), r1: Math.max(b.r1, r), c1: Math.max(b.c1, c) });
      box.set(td, b);
    }),
  );
  const sel = cells.map(c => box.get(c)).filter(Boolean);
  if (!sel.length) return;
  const R0 = Math.min(...sel.map(b => b.r0)), R1 = Math.max(...sel.map(b => b.r1)),
    C0 = Math.min(...sel.map(b => b.c0)), C1 = Math.max(...sel.map(b => b.c1));
  const style = $('#bdStyle').value,
    w = Math.max(parseFloat($('#bdWidth').value), style === 'double' ? 2.25 : 0); // 雙線太細畫不出來
  const spec = kind === 'none' ? 'hidden' : w + 'pt ' + style + ' ' + $('#bdColor').value;
  const set = (td, side) => {
    const b = box.get(td);
    td.style['border' + side] = spec;
    // 對面那格的同一條框線
    const ns = [];
    if (side === 'Top') for (let c = b.c0; c <= b.c1; c++) ns.push(grid[b.r0 - 1] && grid[b.r0 - 1][c]);
    if (side === 'Bottom') for (let c = b.c0; c <= b.c1; c++) ns.push(grid[b.r1 + 1] && grid[b.r1 + 1][c]);
    if (side === 'Left') for (let r = b.r0; r <= b.r1; r++) ns.push(grid[r][b.c0 - 1]);
    if (side === 'Right') for (let r = b.r0; r <= b.r1; r++) ns.push(grid[r][b.c1 + 1]);
    const opp = { Top: 'Bottom', Bottom: 'Top', Left: 'Right', Right: 'Left' }[side];
    new Set(ns.filter(n => n && n !== td)).forEach(n => (n.style['border' + opp] = spec));
  };
  for (const td of cells) {
    const b = box.get(td);
    const edge = { Top: b.r0 === R0, Bottom: b.r1 === R1, Left: b.c0 === C0, Right: b.c1 === C1 };

  const td = p.closest('td'),

    cs = getComputedStyle(p),

  const sx = e.clientX,

const dropCaret = document.createElement('div');

let selImg = null;
function placeImgBar() {
  if (!selImg || !selImg.isConnected) return selectImg(null);

  const above = r.top - imgBar.offsetHeight - 8 > 60 ? r.top - imgBar.offsetHeight - 8 : null;

function caretAt(x, y) {
  if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (!p) return null;
    const r = document.createRange();
    r.setStart(p.offsetNode, p.offset);
    return r;
  }
  return document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
}
const blockOf = img => img.parentElement.closest('p,h1,h2,h3,h4,li,blockquote,pre,div,td,th');
function imgOp(k) {
  const img = selImg;
  if (!img) return;
  recordEdit(() => {
    const st = img.style;
    if (k === 'del') {
      img.remove();
      return;
    }
    if (k === 'up' || k === 'down') {
      const blk = blockOf(img);
      if (!blk || blk === editor) return;
      const alone = blk.tagName === 'P' && !blk.textContent.trim() && blk.querySelectorAll('img').length === 1;
      if (alone) {
        const sib = k === 'up' ? blk.previousElementSibling : blk.nextElementSibling;
        if (sib) k === 'up' ? sib.before(blk) : sib.after(blk);
      } else {
        const p = document.createElement('p');
        p.append(img);
        k === 'up' ? blk.before(p) : blk.after(p);
      }
      return;
    }
    st.float = k === 'floatL' ? 'left' : k === 'floatR' ? 'right' : '';
    st.display = k === 'floatL' || k === 'floatR' ? '' : 'block';
    st.marginTop = st.marginBottom = '';
    if (k === 'floatL') st.margin = '0 8pt 4pt 0';
    else if (k === 'floatR') st.margin = '0 0 4pt 8pt';
    else {
      st.marginLeft = k === 'left' ? '0' : 'auto';
      st.marginRight = k === 'right' ? '0' : 'auto';
    }
  });
  if (!selImg.isConnected) selectImg(null);
  else requestAnimationFrame(placeImgBar);
}
imgBar.addEventListener('pointerdown', e => e.preventDefault()); // 按工具列不要讓編輯區失去選取
imgBar.addEventListener('click', e => {

editor.addEventListener('dragstart', e => {
  if (e.target.tagName === 'IMG') e.preventDefault();
});
editor.addEventListener('pointerdown', e => {
  const img = e.target.closest && e.target.closest('img');
  if (!img || !editor.isContentEditable) return selectImg(null);
  selectImg(img);
  if (e.pointerType !== 'mouse' || e.button !== 0) return; // 觸控只選取（用工具列的 ↑↓ 移動），不擋住捲動
  e.preventDefault();
  const sx = e.clientX,
    sy = e.clientY;
  let moving = false,
    dest = null;
  const move = ev => {
    if (!moving && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
    moving = true;
    img.style.opacity = '0.4';
    imgBar.hidden = selBox.hidden = true;
    dest = caretAt(ev.clientX, ev.clientY);
    const ok = dest && editor.contains(dest.startContainer) && !img.contains(dest.startContainer);
    const rc = ok && (dest.getClientRects()[0] || (dest.startContainer.nodeType === 1 ? dest.startContainer.getBoundingClientRect() : null));
    dropCaret.hidden = !rc;
    if (rc) Object.assign(dropCaret.style, { left: rc.left - 1 + 'px', top: rc.top + 'px', height: Math.max(16, rc.height) + 'px' });
    if (!ok) dest = null;
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    dropCaret.hidden = true;
    img.style.opacity = '';
    if (!img.getAttribute('style')) img.removeAttribute('style');
    if (moving && dest)
      recordEdit(() => {
        const old = blockOf(img);
        dest.insertNode(img);

        if (old && old !== editor && old.tagName === 'P' && !old.textContent.trim() && !old.querySelector('img,table')) old.remove();

  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

// ---- 表格：拖曳欄與欄之間的框線調整欄寬（寫進 colgroup 的百分比，匯出 Word 也照這個比例）----
function colEdgeAt(e) {
  const cell = e.target.closest && e.target.closest('td,th');
  if (!cell || !editor.contains(cell) || !editor.isContentEditable) return null;
  const table = cell.closest('table'),
    { grid, cols } = tableGrid(table);
  if (cols < 2) return null;
  const tol = e.pointerType === 'mouse' ? 5 : 10;
  // 第 j 條內框線：任何「最後一欄是 j」的格子的右緣
  for (let j = 0; j < cols - 1; j++) {
    for (const row of grid) {
      const td = row[j];
      if (!td || row[j + 1] === td) continue;
      const r = td.getBoundingClientRect();
      if (Math.abs(e.clientX - r.right) <= tol && e.clientY >= r.top && e.clientY <= r.bottom) return { table, j, cols, grid };
      break;
    }
  }
  return null;
}
// 列的下框線：這格往下延伸到的最後一列
function rowEdgeAt(e) {
  const tol = e.pointerType === 'mouse' ? 4 : 10;
  // 指標剛好在框線上時多半落在下一列的格子，所以取「指標上方一點」的那格
  const above = document.elementFromPoint(e.clientX, e.clientY - tol),
    cell = above && above.closest('td,th');
  if (!cell || !editor.contains(cell) || !editor.isContentEditable) return null;
  const r = cell.getBoundingClientRect();
  if (Math.abs(e.clientY - r.bottom) > tol) return null;
  const table = cell.closest('table'),
    i = [...table.rows].indexOf(cell.parentElement) + cell.rowSpan - 1;
  return table.rows[i] ? { tr: table.rows[i] } : null;
}
editor.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && !e.buttons) editor.style.cursor = colEdgeAt(e) ? 'col-resize' : rowEdgeAt(e) ? 'row-resize' : '';
});
editor.addEventListener(
  'pointerdown',
  e => {
    if (colEdgeAt(e)) return; // 欄與列交叉處以欄寬優先
    const hit = rowEdgeAt(e);
    if (!hit) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const tr = hit.tr,
      z = editor.getBoundingClientRect().width / editor.offsetWidth || 1, // 分頁檢視縮放時換回 CSS 像素
      h0 = tr.getBoundingClientRect().height / z,
      sy = e.clientY;
    snap();
    const move = ev => (tr.style.height = Math.round(Math.max(16, h0 + (ev.clientY - sy) / z)) + 'px');
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      snap();
      saveDraft();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  },
  true,
);
editor.addEventListener(
  'pointerdown',
  e => {
    const hit = colEdgeAt(e);
    if (!hit) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const { table, j, cols, grid } = hit;
    // 目前各欄實際寬度（取每欄一個單欄格子量）
    const w0 = Array.from({ length: cols }, (_, c) => {
      for (const row of grid) {
        const td = row[c];
        if (td && td.colSpan === 1) return td.getBoundingClientRect().width;
      }
      return table.getBoundingClientRect().width / cols;
    });
    const sum = w0.reduce((a, b) => a + b, 0);
    snap();
    let cg = table.querySelector(':scope > colgroup');
    if (!cg) {
      cg = document.createElement('colgroup');
      table.prepend(cg);
    }
    cg.innerHTML = '<col>'.repeat(cols);
    table.style.tableLayout = 'fixed';
    const setW = ws => [...cg.children].forEach((col, i) => (col.style.width = ((ws[i] / sum) * 100).toFixed(2) + '%'));
    setW(w0);
    const sx = e.clientX;
    const move = ev => {
      const ws = w0.slice(),
        pair = w0[j] + w0[j + 1];
      ws[j] = Math.max(20, Math.min(pair - 20, w0[j] + ev.clientX - sx));
      ws[j + 1] = pair - ws[j];
      setW(ws);
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      snap();
      saveDraft();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  },
  true,
);

// 下拉選單：一次只開一個、點外面或按 Esc 關閉、選完項目自動收起

  const p = d.querySelector('.panel'),

  p.style.top = (p.offsetHeight > below && r.top > below ? r.top - 4 - p.offsetHeight : r.bottom + 4) + 'px';

function safeName(fallback) {

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  offerShare(blob, name);
}

// navigator.share 必須由使用者的點擊觸發，產生 PDF 花的幾秒會讓原本那次點擊失效，所以要另外按一次
let shareFile = null,
  shareT;
function offerShare(blob, name) {
  if (!navigator.canShare || !matchMedia('(pointer: coarse)').matches) return;
  const f = new File([blob], name, { type: blob.type });
  try {
    if (!navigator.canShare({ files: [f] })) return;
  } catch (e) {
    return;
  }
  shareFile = f;
  $('#shareName').textContent = '已下載「' + name + '」';
  $('#shareBar').hidden = false;
  clearTimeout(shareT);
  shareT = setTimeout(() => ($('#shareBar').hidden = true), 30000);
}
$('#shareBtn').onclick = () => {
  if (!shareFile) return;
  navigator
    .share({ files: [shareFile], title: shareFile.name })
    .then(() => ($('#shareBar').hidden = true))
    .catch(err => {
      if (err.name !== 'AbortError') msg('無法分享：' + err.message, true);
    });
};

function pdfPage() {
  if (editor.dataset.customPage === '1') {
    const mm = v => parseFloat(v) || 0;
    const pad = editor.style.padding.split(/\s+/).map(mm);
    while (pad.length < 4) pad.push(pad[pad.length > 1 ? pad.length - 2 : 0]);
    return { pageW: mm(editor.style.width), pageH: mm(editor.style.minHeight), margins: pad };
  }
  const [w, h] = (PAGE[$('#pageSize').value] || PAGE.a4).split(' ').map(parseFloat);

  return { pageW: land ? h : w, pageH: land ? w : h, margins: [m, m, m, m] };

    showHits('正規表達式錯誤：' + e.message);
    return;
  }
  hits = [];
  if (re)
    textBlocks().forEach((b, bi) => {
      for (const m of b.text.matchAll(re)) {
        if (!m[0]) continue;
        const r = document.createRange();
        r.setStart(...textPos(b, m.index));
        r.setEnd(...textPos(b, m.index + m[0].length, 1));
        hits.push({
          r,
          m: m[0],
          groups: m.slice(1),
          names: m.groups || null,
          no: bi + 1,
          pre: b.text.slice(Math.max(0, m.index - 30), m.index),
          post: b.text.slice(m.index + m[0].length, m.index + m[0].length + 30),
          cut: [m.index > 30, m.index + m[0].length + 30 < b.text.length],
        });
      }
    });
  hi = Math.min(hi, hits.length - 1);
  showHits(re ? '' : '');
}
const HIT_LIST_MAX = 400,
  HIT_MARK_MAX = 800; // 上萬筆命中時不要產生上萬個 DOM 節點與 Range
function showHits(err) {
  $('#findRes').classList.toggle('show', !!(err || $('#findText').value.trim()));
  $('#findList').innerHTML = hits
    .slice(0, HIT_LIST_MAX)
    .map(
      (h, i) =>
        '<button class="hit" data-i="' +
        i +
        '"><small>第 ' +
        h.no +
        ' 段</small>' +
        (h.cut[0] ? '…' : '') +
        esc(h.pre) +
        '<mark>' +
        esc(h.m) +
        '</mark>' +
        esc(h.post) +
        (h.cut[1] ? '…' : '') +
        '</button>',
    )
    .join('');
  if (HL) HL.set('find', new Highlight(...hits.slice(0, HIT_MARK_MAX).map(h => h.r)));
  markHit(err);
}
function markHit(err) {
  $('#findCount').textContent =
    err ||
    (!hits.length
      ? '找不到符合項目'
      : (hi < 0 ? '共 ' + hits.length + ' 筆' : hi + 1 + ' / ' + hits.length) +
        (hits.length > HIT_LIST_MAX
          ? '（清單只列前 ' + HIT_LIST_MAX + ' 筆、標示前 ' + HIT_MARK_MAX + ' 筆）'
          : ''));
  document.querySelectorAll('.hit').forEach(b => b.classList.toggle('cur', +b.dataset.i === hi));
  if (HL) {
    if (hi < 0) HL.delete('find-cur');
    else HL.set('find-cur', new Highlight(hits[hi].r));
  }
}
function goHit(i) {
  if (!hits.length) return;
  hi = (i + hits.length) % hits.length;
  const h = hits[hi];
  markHit();
  if (!HL) {
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(h.r);
  }
  h.r.startContainer.parentElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const b = document.querySelector('.hit.cur');
  if (b) b.scrollIntoView({ block: 'nearest' });
}
// 取代字串依「命中當下」捕捉的群組展開（原本是拿命中的子字串再跑一次 regex，^ $、前後文與大小寫會走味）
function expandReplacement(rep, full, groups, names) {
  return String(rep).replace(/\$(\$|&|\d{1,2}|<[^>]+>)/g, (all, tok) => {
    if (tok === '$') return '$';
    if (tok === '&') return full;
    if (tok.charAt(0) === '<') {
      const k = tok.slice(1, -1);
      return names && names[k] != null ? names[k] : all;
    }
    const i = +tok;
    return groups && i >= 1 && i <= groups.length && groups[i - 1] != null ? groups[i - 1] : all;
  });
}
function replaceHit(h) {
  const t = isRe
    ? expandReplacement($('#replaceText').value, h.m, h.groups, h.names)
    : $('#replaceText').value;
  h.r.deleteContents();
  h.r.insertNode(document.createTextNode(t));
}
$('#findText').oninput = () => {
  clearTimeout(findT);
  findT = setTimeout(() => {
    hi = -1;
    runFind();
    goHit(0);
  }, 250);
};
$('#findText').onkeydown = e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(findT);
    if (!hits.length) runFind();
    goHit(hi + (e.shiftKey ? -1 : 1));
  }
};
$('#findNext').onclick = () => goHit(hi + 1);
$('#findPrev').onclick = () => goHit(hi - 1);
$('#findList').onclick = e => {
  const b = e.target.closest('.hit');
  if (b) goHit(+b.dataset.i);
};
editor.addEventListener('input', () => {
  if ($('#findbar').style.display === 'flex') {
    clearTimeout(findT);
    findT = setTimeout(runFind, 300);
  }
});
// 貼上一律先清毒再插入（瀏覽器自己也會清，但這樣行為一致），圖片另外走縮圖管線
editor.addEventListener('paste', e => {
  const cd = e.clipboardData;
  if (!cd) return;
  const html = cd.getData('text/html');
  snap();
  const before = hist[histI]; // 貼上前的狀態
  if (html) {
    e.preventDefault();
    insertHtmlAtCaret(sanitizeHtml(html), { replaceSel: true });
  }
  setTimeout(() => {
    shrinkEditorImages().then(saved => {
      // 縮圖併進「貼上」那一筆，不另外多一步復原：貼上已經記過就改寫那筆，還沒記（瀏覽器原生貼上、
      // 打字停頓計時還沒到）就現在記
      const k = hist.indexOf(before);
      // （就算沒縮小，也會標上 data-shrunk，HTML 一樣有變）
      if (k >= 0 && histI === k + 1) {
        hist[histI].h = editor.innerHTML;
        hist[histI].sel = selPath() || hist[histI].sel;
      } else snap();
      saveDraft();
      if (saved > 0) msg('貼上的圖片已自動縮圖，省下 ' + Math.round(saved / 1024) + 'KB');
    });
  }, 30);
});
async function shrinkEditorImages() {
  const imgs = [...editor.querySelectorAll('img')].filter(
    im => /^(data:image\/|blob:)/i.test(im.getAttribute('src') || '') && im.dataset.shrunk !== '1',
  );
  let saved = 0;
  for (const im of imgs) {
    im.dataset.shrunk = '1';
    try {
      let src = im.getAttribute('src');
      if (/^blob:/i.test(src)) {
        const b = await (await fetch(src)).blob();
        src = await fileToDataUrl(b);
        im.setAttribute('src', src);
      }
      const small = await shrinkDataUrl(src);
      if (small !== src) {
        saved += src.length - small.length;
        im.setAttribute('src', small);
      }
    } catch (e) {}
  }
  return saved;
}
$('#replaceOne').onclick = () => {
  runFind();
  if (!hits.length) return;
  const i = Math.max(hi, 0);
  recordEdit(() => replaceHit(hits[i]));
  runFind();
  if (hits.length) goHit(Math.min(i, hits.length - 1));
  msg('已取代 1 處');
};
$('#replaceAll').onclick = () => {
  runFind();
  const n = hits.length;
  if (!n) return;
  recordEdit(() => hits.slice().reverse().forEach(replaceHit));
  hi = -1;
  runFind();
  msg('已取代 ' + n + ' 處');
};
// Updates: changelog.json is the release record, newest first. Its top version at load is the one running; a later fetch saying otherwise means a newer deploy.
let runningVer = null,
  logReady;
const fetchLog = () =>
  fetch('./changelog.json', { cache: 'no-store' }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
function showLog(entries, title) {
  $('#logTitle').textContent = title;
  $('#logBody').replaceChildren(
    ...entries.map(e => {
      const sec = document.createElement('section'),
        h = document.createElement('h4'),
        ul = document.createElement('ul');
      h.textContent = e.version;
      ul.append(
        // 更新紀錄是外部檔案，格式不對時不該讓整個「已更新」提示掛掉（原本會丟 TypeError 且被吞掉）
        ...(Array.isArray(e.notes) ? e.notes : []).map(n => {
          const li = document.createElement('li');
          li.textContent = n;
          return li;
        }),
      );
      sec.append(h, ul);
      return sec;
    }),
  );
  $('#logModal').hidden = false;
}
$('#logBtn').onclick = () =>
  fetchLog()
    .then(l => showLog(l, '更新紀錄'))
    .catch(() => msg('無法載入更新紀錄', true));
$('#logClose').onclick = () => {
  $('#logModal').hidden = true;
};
$('#logModal').onclick = e => {
  if (e.target.id === 'logModal') e.target.hidden = true;
};
(logReady = fetchLog())
  .then(log => {
    runningVer = log[0] && log[0].version;
    if (!runningVer) return;
    let seen = null,
      returning = false;
    try {
      seen = localStorage.getItem('seenVersion');
      returning = seen !== null || !!localStorage.getItem('draft');
    } catch (e) {}
    if (seen !== runningVer && returning) {
      const i = log.findIndex(e => e.version === seen);
      showLog(i === -1 ? log.slice(0, 1) : log.slice(0, i), '已更新到 ' + runningVer);
    }
    try {
      localStorage.setItem('seenVersion', runningVer);
    } catch (e) {}
  })
  .catch(() => {});
function checkUpdate() {
  if (!runningVer || document.hidden || !$('#updBar').hidden) return;
  fetchLog()
    .then(l => {
      if (l[0] && l[0].version !== runningVer) $('#updBar').hidden = false;
    })
    .catch(() => {});
}
document.addEventListener('visibilitychange', checkUpdate);
setInterval(checkUpdate, 30 * 60 * 1000);
$('#updReload').onclick = () => location.reload();
$('#updClose').onclick = () => {
  $('#updBar').hidden = true;
};
// Service Worker：第一次載入後即可離線開啟（DOCX 解析與 PDF 產生都已經在本機）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker
    .register('./sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(async reg => {
      try {
        const log = await logReady;
        const v = log && log[0] && log[0].version;
        if (v && reg.active) reg.active.postMessage({ version: v }); // 版本換了就讓 SW 重抓 vendor 檔案
      } catch (e) {}
    })
    .catch(() => {});
}
</script>
