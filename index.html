<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word 文件簡易編輯與 PDF 轉換工具</title>
<style>
:root{--blue:#2563eb;--green:#059669;--slate:#334155;--line:#dbe3ee;--bg:#eef2f7;--warn:#fffbeb}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:#1e293b}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0f172a10}.topin,.wrap{max-width:1280px;margin:auto}.topin{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#64748b;margin:3px 0 0}.actions,.tools,.findbar,.settings{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn,.tool,select,input{font:inherit}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover,.tool:hover{background:#f8fafc}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1d4ed8}.pdf{background:var(--green);border-color:var(--green);color:white}.pdf:hover{background:#047857}.wrap{padding:18px}.notice{display:none;background:var(--warn);border:1px solid #fde68a;color:#854d0e;padding:11px 14px;border-radius:12px;margin-bottom:12px}.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 3px 12px #0f172a0c}.tool{border:0;background:white;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:37px}.sep{height:28px;width:1px;background:var(--line);margin:0 3px}.tools select,.findbar input,.filename{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.settings{margin-left:auto}.findbar{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.findres{flex-basis:100%;display:none}.findres.show{display:block}.findhead{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}.findhead span{margin-right:auto}#findList{max-height:30vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}#findList:empty{display:none}.hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:8px 10px;font:inherit;font-size:14px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}.hit:last-child{border-bottom:0}.hit small{color:#64748b;margin-right:6px}.hit mark{background:#fde68a;padding:0 1px}.hit.cur{background:#eff6ff}::highlight(find){background:#fde68a}::highlight(find-cur){background:#f59e0b;color:#fff}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:13px auto 7px;max-width:210mm;font-size:12px;color:#64748b}.filename{width:320px;color:#1e293b;font-weight:700}.paper{width:210mm;min-height:297mm;margin:auto;background:white;padding:18mm;box-shadow:0 10px 30px #0f172a25;outline:none;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;font-size:16px;line-height:1.75;overflow-wrap:anywhere}.paper.landscape{width:297mm;min-height:210mm}.paper h1{font-size:30px;margin:.5em 0}.paper h2{font-size:24px}.paper img{max-width:100%;height:auto}.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #94a3b8;padding:6px}.statusbusy{opacity:.65;pointer-events:none}@media(max-width:900px){.topin{align-items:flex-start;flex-direction:column}.settings{margin-left:0}.paper,.paper.landscape{width:100%;min-height:70vh;padding:28px}.meta{max-width:none}}@media(max-width:640px){.topin{padding:8px 12px;gap:8px;flex-direction:row;align-items:center}.brand{display:none}.actions{flex:1}.actions .btn{flex:1}.logo{width:36px;height:36px;font-size:19px}.actions{flex-wrap:nowrap;gap:6px}.btn{padding:10px 8px;min-height:42px;white-space:nowrap;font-size:14px}.wrap{padding:8px}.toolbar{position:sticky;top:57px;z-index:9;padding:6px;border-radius:12px}.tools{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool,.tools select{flex:none;min-height:42px;min-width:42px}.settings{display:flex;flex-wrap:nowrap}.findbar input{flex:1 1 40%;min-width:0}.meta{flex-direction:column;align-items:stretch;gap:4px;margin:8px 0}.filename{width:100%}.paper,.paper.landscape{padding:16px;min-height:60vh;box-shadow:0 4px 14px #0f172a20}.paper h1{font-size:24px}.paper h2{font-size:20px}.paper table{display:block;overflow-x:auto}}input,select{font-size:16px}body.desk .paper{width:210mm;min-height:297mm;padding:18mm}body.desk .paper.landscape{width:297mm;min-height:210mm}body.desk:not(.finding) .toolbar,body.desk .tools,body.desk #replaceText,body.desk #replaceOne,body.desk #replaceAll,body.desk .meta,body.desk .notice{display:none!important}body.desk .findbar{border:0;margin:0;padding:0}.readbar{display:none;gap:8px;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20}.readbar .btn{box-shadow:0 4px 14px #0f172a40}body.desk .readbar{display:flex}#updBar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px #0f172a30;white-space:nowrap;max-width:calc(100vw - 24px)}#updBar[hidden],#logModal[hidden]{display:none}#logModal{position:fixed;inset:0;z-index:40;background:#0f172a80;display:flex;align-items:center;justify-content:center;padding:16px}.logbox{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:80vh;overflow:auto;box-shadow:0 10px 30px #0f172a40}.loghead{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}#logBody{padding:14px 18px 18px}#logBody h4{margin:0 0 6px}#logBody section+section{margin-top:14px}#logBody ul{margin:0;padding-left:1.2em;line-height:1.6}@media print{body{background:white}.no-print{display:none!important}.wrap{padding:0}.paper,.paper.landscape{zoom:1!important;box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}}
</style>
</head>
<body>
<header class="top no-print"><div class="topin"><div class="brand"><div class="logo">W</div><div><h1>Word 文件簡易編輯器</h1><p>檔案在本機瀏覽器處理，不主動上傳</p></div></div><div class="actions"><input id="file" type="file" accept=".doc,.docx" hidden><button class="btn" id="newBtn">新文件</button><button class="btn primary" id="openBtn">載入 Word</button><button class="btn" id="saveBtn">儲存 HTML</button><button class="btn pdf" id="pdfBtn">轉換 PDF</button></div></div></header>
<div class="wrap"><div id="notice" class="notice no-print"></div><section class="toolbar no-print"><div class="tools"><button class="tool" data-cmd="undo" title="復原">↶</button><button class="tool" data-cmd="redo" title="重做">↷</button><span class="sep"></span><select id="fontSize" title="字級"><option value="2">小字</option><option value="3" selected>一般</option><option value="4">大字</option><option value="5">標題</option></select><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="underline"><u>U</u></button><span class="sep"></span><button class="tool" data-cmd="justifyLeft">靠左</button><button class="tool" data-cmd="justifyCenter">置中</button><button class="tool" data-cmd="justifyRight">靠右</button><button class="tool" data-cmd="insertUnorderedList">• 清單</button><button class="tool" data-cmd="insertOrderedList">1. 編號</button><span class="sep"></span><button class="tool" id="findToggle">尋找取代</button><button class="tool" id="deskToggle" title="以電腦版 A4 版面唯讀檢視，縮放至螢幕寬">閱讀模式</button><button class="tool" onclick="window.print()">列印</button><button class="tool" id="logBtn">更新紀錄</button><div class="settings"><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select><select id="orientation"><option value="portrait">直向</option><option value="landscape">橫向</option></select></div></div><div id="findbar" class="findbar"><input id="findText" placeholder="尋找：多個關鍵字用空格，/正則/" enterkeyhint="search"><input id="replaceText" placeholder="取代為"><button class="btn" id="replaceOne">取代</button><button class="btn" id="replaceAll">全部取代</button><div id="findRes" class="findres"><div class="findhead"><span id="findCount"></span><button class="tool" id="findPrev" title="上一筆">‹</button><button class="tool" id="findNext" title="下一筆">›</button></div><div id="findList"></div></div></div></section><div class="meta no-print"><input id="filename" class="filename" value="未命名文件"><span id="status">請載入 DOCX 文件，或直接開始輸入內容</span></div><article id="editor" class="paper" contenteditable="true" spellcheck="true"><h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p></article></div>
<div id="updBar" class="no-print" hidden><span>有新版本可以使用</span><button class="btn primary" id="updReload">立即更新</button><button class="tool" id="updClose" aria-label="稍後再更新">✕</button></div><div id="logModal" class="no-print" hidden><div class="logbox" role="dialog" aria-modal="true" aria-labelledby="logTitle"><div class="loghead"><b id="logTitle">更新紀錄</b><button class="tool" id="logClose" aria-label="關閉">✕</button></div><div id="logBody"></div></div></div><div class="readbar no-print"><button id="readFind" class="btn">搜尋</button><button id="readExit" class="btn primary">結束閱讀</button></div>
<script>
const $=s=>document.querySelector(s), editor=$('#editor'), statusEl=$('#status'), notice=$('#notice');
function msg(text,warn=false){statusEl.textContent=text;if(warn){notice.textContent=text;notice.style.display='block'}}
function loadScript(src,global){return new Promise((ok,fail)=>{if(window[global])return ok();const old=document.querySelector('script[src="'+src+'"]');if(old){old.addEventListener('load',ok);old.addEventListener('error',fail);return}const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('無法載入必要元件'));document.head.appendChild(s)})}
$('.toolbar').addEventListener('mousedown',e=>{if(e.target.closest('.tool'))e.preventDefault()});$('.tools').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;editor.focus();document.execCommand(b.dataset.cmd,false,null)});$('#fontSize').onchange=e=>{editor.focus();document.execCommand('fontSize',false,e.target.value)};let saveT;function saveDraft(){try{localStorage.setItem('draft',JSON.stringify({html:editor.innerHTML,name:$('#filename').value}))}catch(e){}}editor.oninput=()=>{msg('內容已修改，尚未匯出');clearTimeout(saveT);saveT=setTimeout(saveDraft,800)};$('#filename').oninput=saveDraft;try{const d=JSON.parse(localStorage.getItem('draft'));if(d&&d.html){editor.innerHTML=d.html;$('#filename').value=d.name||'未命名文件';msg('已還原上次的草稿')}}catch(e){}document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});
$('#newBtn').onclick=()=>{if(!confirm('清除目前內容並開新文件？未匯出的內容將遺失。'))return;try{localStorage.removeItem('draft')}catch(e){}editor.innerHTML='<h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p>';$('#filename').value='未命名文件';notice.style.display='none';msg('已開新文件')};$('#openBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;notice.style.display='none';const ext=file.name.split('.').pop().toLowerCase();if(ext==='doc')return msg('舊版 .doc 無法由純瀏覽器可靠解析，請先用 Word 或 LibreOffice 另存為 .docx。',true);if(ext!=='docx')return msg('請選擇 .docx 文件。',true);document.body.classList.add('statusbusy');msg('正在解析 DOCX…');try{await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js','mammoth');const result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()},{styleMap:["p[style-name='Title'] => h1:fresh","p[style-name='Heading 1'] => h1:fresh","p[style-name='Heading 2'] => h2:fresh"]});editor.innerHTML=result.value||'<p></p>';$('#filename').value=file.name.replace(/\.docx$/i,'');saveDraft();msg(result.messages.length?'載入完成；複雜格式可能無法完整保留':'載入完成，可開始編輯',!!result.messages.length)}catch(err){msg('開啟失敗：'+err.message,true)}finally{document.body.classList.remove('statusbusy')}};
$('#saveBtn').onclick=()=>{const title=$('#filename').value||'文件';const html='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:"Microsoft JhengHei",sans-serif;line-height:1.75;max-width:210mm;margin:20px auto;padding:18mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:6px}img{max-width:100%}</style></head><body>'+editor.innerHTML+'</body></html>';download(new Blob([html],{type:'text/html;charset=utf-8'}),title+'.html');msg('HTML 已下載')};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#pdfBtn').onclick=async()=>{document.body.classList.add('statusbusy');msg('正在產生 PDF…');editor.style.zoom='';try{await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js','html2pdf');await html2pdf().set({margin:[12,12,12,12],filename:($('#filename').value||'文件')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:innerWidth<640?1.5:2,useCORS:true,letterRendering:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:$('#pageSize').value,orientation:$('#orientation').value},pagebreak:{mode:['css','legacy'],avoid:['tr','img']}}).from(editor).save();msg('PDF 已下載')}catch(err){msg('PDF 產生失敗：'+err.message+'；可改用「列印」後選擇另存為 PDF。',true)}finally{fit();document.body.classList.remove('statusbusy')}};
function fit(){editor.style.zoom='';if(document.body.classList.contains('desk')){const w=editor.parentElement,c=getComputedStyle(w);editor.style.zoom=Math.min(1,(w.clientWidth-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight))/editor.offsetWidth)}}function setDesk(on){document.body.classList.toggle('desk',on);editor.contentEditable=!on;try{localStorage.setItem('desk',on?'1':'')}catch(e){}fit()}$('#deskToggle').onclick=()=>setDesk(true);$('#readFind').onclick=()=>$('#findToggle').click();$('#readExit').onclick=()=>setDesk(false);addEventListener('resize',fit);try{if(localStorage.getItem('desk'))setDesk(true)}catch(e){}$('#orientation').onchange=e=>{editor.classList.toggle('landscape',e.target.value==='landscape');fit()};$('#findToggle').onclick=()=>{const open=$('#findbar').style.display!=='flex';$('#findbar').style.display=open?'flex':'none';document.body.classList.toggle('finding',open);if(open){$('#findText').focus();runFind()}else{hits=[];hi=-1;if(HL){HL.delete('find');HL.delete('find-cur')}}};const BLOCK='p,h1,h2,h3,h4,h5,h6,li,td,th,blockquote,pre,div',HL=window.CSS&&CSS.highlights;let hits=[],hi=-1,isRe=false,findT;
function findPattern(q){q=q.trim();isRe=false;if(!q)return null;const k=q.lastIndexOf('/');if(q[0]==='/'&&k>1&&/^[imsu]*$/.test(q.slice(k+1))){isRe=true;return new RegExp(q.slice(1,k),q.slice(k+1)+'g')}return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(/\s+/).join('.*?'),'gi')}
function textBlocks(){const g=new Map(),w=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const b=n.parentElement.closest(BLOCK),el=b&&editor.contains(b)?b:editor;if(!g.has(el))g.set(el,{nodes:[],text:''});const x=g.get(el);x.nodes.push({n,s:x.text.length});x.text+=n.nodeValue}return[...g.values()]}
function textPos(b,i,end){for(const x of b.nodes){const e=x.s+x.n.nodeValue.length;if(i<e||end&&i===e)return[x.n,i-x.s]}const l=b.nodes[b.nodes.length-1];return[l.n,l.n.nodeValue.length]}
const esc=t=>t.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function runFind(){let re;try{re=findPattern($('#findText').value)}catch(e){hits=[];showHits('正規表達式錯誤：'+e.message);return}hits=[];if(re)textBlocks().forEach((b,bi)=>{for(const m of b.text.matchAll(re)){if(!m[0])continue;const r=document.createRange();r.setStart(...textPos(b,m.index));r.setEnd(...textPos(b,m.index+m[0].length,1));hits.push({r,m:m[0],no:bi+1,pre:b.text.slice(Math.max(0,m.index-30),m.index),post:b.text.slice(m.index+m[0].length,m.index+m[0].length+30),cut:[m.index>30,m.index+m[0].length+30<b.text.length]})}});hi=Math.min(hi,hits.length-1);showHits(re?'':'')}
function showHits(err){$('#findRes').classList.toggle('show',!!(err||$('#findText').value.trim()));$('#findList').innerHTML=hits.map((h,i)=>'<button class="hit" data-i="'+i+'"><small>第 '+h.no+' 段</small>'+(h.cut[0]?'…':'')+esc(h.pre)+'<mark>'+esc(h.m)+'</mark>'+esc(h.post)+(h.cut[1]?'…':'')+'</button>').join('');if(HL)HL.set('find',new Highlight(...hits.map(h=>h.r)));markHit(err)}
function markHit(err){$('#findCount').textContent=err||(!hits.length?'找不到符合項目':hi<0?'共 '+hits.length+' 筆':(hi+1)+' / '+hits.length);document.querySelectorAll('.hit').forEach(b=>b.classList.toggle('cur',+b.dataset.i===hi));if(HL){if(hi<0)HL.delete('find-cur');else HL.set('find-cur',new Highlight(hits[hi].r))}}
function goHit(i){if(!hits.length)return;hi=(i+hits.length)%hits.length;const h=hits[hi];markHit();if(!HL){const sel=getSelection();sel.removeAllRanges();sel.addRange(h.r)}h.r.startContainer.parentElement.scrollIntoView({block:'center',behavior:'smooth'});const b=document.querySelector('.hit.cur');if(b)b.scrollIntoView({block:'nearest'})}
function replaceHit(h){const t=isRe?h.m.replace(findPattern($('#findText').value),$('#replaceText').value):$('#replaceText').value;h.r.deleteContents();h.r.insertNode(document.createTextNode(t))}
$('#findText').oninput=()=>{clearTimeout(findT);findT=setTimeout(()=>{hi=-1;runFind();goHit(0)},250)};$('#findText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(findT);if(!hits.length)runFind();goHit(hi+(e.shiftKey?-1:1))}};
$('#findNext').onclick=()=>goHit(hi+1);$('#findPrev').onclick=()=>goHit(hi-1);$('#findList').onclick=e=>{const b=e.target.closest('.hit');if(b)goHit(+b.dataset.i)};
editor.addEventListener('input',()=>{if($('#findbar').style.display==='flex'){clearTimeout(findT);findT=setTimeout(runFind,300)}});
$('#replaceOne').onclick=()=>{runFind();if(!hits.length)return;const i=Math.max(hi,0);replaceHit(hits[i]);saveDraft();runFind();if(hits.length)goHit(Math.min(i,hits.length-1));msg('已取代 1 處')};
$('#replaceAll').onclick=()=>{runFind();const n=hits.length;if(!n)return;hits.slice().reverse().forEach(replaceHit);saveDraft();hi=-1;runFind();msg('已取代 '+n+' 處')};
// Updates: changelog.json is the release record, newest first. Its top version at load is the one running; a later fetch saying otherwise means a newer deploy.
let runningVer=null;const fetchLog=()=>fetch('./changelog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
function showLog(entries,title){$('#logTitle').textContent=title;$('#logBody').replaceChildren(...entries.map(e=>{const sec=document.createElement('section'),h=document.createElement('h4'),ul=document.createElement('ul');h.textContent=e.version;ul.append(...e.notes.map(n=>{const li=document.createElement('li');li.textContent=n;return li}));sec.append(h,ul);return sec}));$('#logModal').hidden=false}
$('#logBtn').onclick=()=>fetchLog().then(l=>showLog(l,'更新紀錄')).catch(()=>msg('無法載入更新紀錄',true));$('#logClose').onclick=()=>{$('#logModal').hidden=true};$('#logModal').onclick=e=>{if(e.target.id==='logModal')e.target.hidden=true};
fetchLog().then(log=>{runningVer=log[0]&&log[0].version;if(!runningVer)return;let seen=null,returning=false;try{seen=localStorage.getItem('seenVersion');returning=seen!==null||!!localStorage.getItem('draft')}catch(e){}if(seen!==runningVer&&returning){const i=log.findIndex(e=>e.version===seen);showLog(i===-1?log.slice(0,1):log.slice(0,i),'已更新到 '+runningVer)}try{localStorage.setItem('seenVersion',runningVer)}catch(e){}}).catch(()=>{});
function checkUpdate(){if(!runningVer||document.hidden||!$('#updBar').hidden)return;fetchLog().then(l=>{if(l[0]&&l[0].version!==runningVer)$('#updBar').hidden=false}).catch(()=>{})}
document.addEventListener('visibilitychange',checkUpdate);setInterval(checkUpdate,30*60*1000);$('#updReload').onclick=()=>location.reload();$('#updClose').onclick=()=>{$('#updBar').hidden=true};
</script>
</body></html>
