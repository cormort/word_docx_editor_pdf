<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word 文件簡易編輯與 PDF 轉換工具</title>
<style>
:root{--blue:#2563eb;--green:#059669;--slate:#334155;--line:#dbe3ee;--bg:#eef2f7;--warn:#fffbeb}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:#1e293b}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0f172a10}.topin,.wrap{max-width:1280px;margin:auto}.topin{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--blue);color:white;display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#64748b;margin:3px 0 0}.actions,.tools,.findbar,.settings{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn,.tool,select,input{font:inherit}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover,.tool:hover{background:#f8fafc}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1d4ed8}.pdf{background:var(--green);border-color:var(--green);color:white}.pdf:hover{background:#047857}.wrap{padding:18px}.notice{display:none;background:var(--warn);border:1px solid #fde68a;color:#854d0e;padding:11px 14px;border-radius:12px;margin-bottom:12px}.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 3px 12px #0f172a0c}.tool{border:0;background:white;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:37px}.sep{height:28px;width:1px;background:var(--line);margin:0 3px}.tools select,.findbar input,.filename{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.settings{margin-left:auto}.findbar{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:13px auto 7px;max-width:210mm;font-size:12px;color:#64748b}.filename{width:320px;color:#1e293b;font-weight:700}.paper{width:210mm;min-height:297mm;margin:auto;background:white;padding:18mm;box-shadow:0 10px 30px #0f172a25;outline:none;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;font-size:16px;line-height:1.75;overflow-wrap:anywhere}.paper.landscape{width:297mm;min-height:210mm}.paper h1{font-size:30px;margin:.5em 0}.paper h2{font-size:24px}.paper img{max-width:100%;height:auto}.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #94a3b8;padding:6px}.statusbusy{opacity:.65;pointer-events:none}@media(max-width:900px){.topin{align-items:flex-start;flex-direction:column}.settings{margin-left:0}.paper,.paper.landscape{width:100%;min-height:70vh;padding:28px}.meta{max-width:none}}@media(max-width:640px){.topin{padding:8px 12px;gap:8px;flex-direction:row;align-items:center}.brand p,.brand h1{display:none}.logo{width:36px;height:36px;font-size:19px}.actions{flex-wrap:nowrap;gap:6px}.btn{padding:10px 11px;min-height:42px}.wrap{padding:8px}.toolbar{position:sticky;top:57px;z-index:9;padding:6px;border-radius:12px}.tools{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool,.tools select{flex:none;min-height:42px;min-width:42px}.settings{display:flex;flex-wrap:nowrap}.findbar input{flex:1 1 40%;min-width:0}.meta{flex-direction:column;align-items:stretch;gap:4px;margin:8px 0}.filename{width:100%}.paper,.paper.landscape{padding:16px;min-height:60vh;box-shadow:0 4px 14px #0f172a20}.paper h1{font-size:24px}.paper h2{font-size:20px}.paper table{display:block;overflow-x:auto}}input,select{font-size:16px}@media print{body{background:white}.no-print{display:none!important}.wrap{padding:0}.paper,.paper.landscape{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}}
</style>
</head>
<body>
<header class="top no-print"><div class="topin"><div class="brand"><div class="logo">W</div><div><h1>Word 文件簡易編輯器</h1><p>檔案在本機瀏覽器處理，不主動上傳</p></div></div><div class="actions"><input id="file" type="file" accept=".doc,.docx" hidden><button class="btn primary" id="openBtn">載入 Word</button><button class="btn" id="saveBtn">儲存 HTML</button><button class="btn pdf" id="pdfBtn">轉換 PDF</button></div></div></header>
<div class="wrap"><div id="notice" class="notice no-print"></div><section class="toolbar no-print"><div class="tools"><button class="tool" data-cmd="undo" title="復原">↶</button><button class="tool" data-cmd="redo" title="重做">↷</button><span class="sep"></span><select id="fontSize" title="字級"><option value="2">小字</option><option value="3" selected>一般</option><option value="4">大字</option><option value="5">標題</option></select><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="underline"><u>U</u></button><span class="sep"></span><button class="tool" data-cmd="justifyLeft">靠左</button><button class="tool" data-cmd="justifyCenter">置中</button><button class="tool" data-cmd="justifyRight">靠右</button><button class="tool" data-cmd="insertUnorderedList">• 清單</button><button class="tool" data-cmd="insertOrderedList">1. 編號</button><span class="sep"></span><button class="tool" id="findToggle">尋找取代</button><button class="tool" onclick="window.print()">列印</button><div class="settings"><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option></select><select id="orientation"><option value="portrait">直向</option><option value="landscape">橫向</option></select></div></div><div id="findbar" class="findbar"><input id="findText" placeholder="尋找文字"><input id="replaceText" placeholder="取代為"><button class="btn" id="findNext">找下一個</button><button class="btn" id="replaceOne">取代</button><button class="btn" id="replaceAll">全部取代</button></div></section><div class="meta no-print"><input id="filename" class="filename" value="未命名文件"><span id="status">請載入 DOCX 文件，或直接開始輸入內容</span></div><article id="editor" class="paper" contenteditable="true" spellcheck="true"><h1>文件標題</h1><p>可直接在此輸入或貼上內容。</p></article></div>
<script>
const $=s=>document.querySelector(s), editor=$('#editor'), statusEl=$('#status'), notice=$('#notice');
function msg(text,warn=false){statusEl.textContent=text;if(warn){notice.textContent=text;notice.style.display='block'}}
function loadScript(src,global){return new Promise((ok,fail)=>{if(window[global])return ok();const old=document.querySelector('script[src="'+src+'"]');if(old){old.addEventListener('load',ok);old.addEventListener('error',fail);return}const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('無法載入必要元件'));document.head.appendChild(s)})}
$('.toolbar').addEventListener('mousedown',e=>{if(e.target.closest('.tool'))e.preventDefault()});$('.tools').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;editor.focus();document.execCommand(b.dataset.cmd,false,null)});$('#fontSize').onchange=e=>{editor.focus();document.execCommand('fontSize',false,e.target.value)};editor.oninput=()=>msg('內容已修改，尚未匯出');
$('#openBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;notice.style.display='none';const ext=file.name.split('.').pop().toLowerCase();if(ext==='doc')return msg('舊版 .doc 無法由純瀏覽器可靠解析，請先用 Word 或 LibreOffice 另存為 .docx。',true);if(ext!=='docx')return msg('請選擇 .docx 文件。',true);document.body.classList.add('statusbusy');msg('正在解析 DOCX…');try{await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js','mammoth');const result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()},{styleMap:["p[style-name='Title'] => h1:fresh","p[style-name='Heading 1'] => h1:fresh","p[style-name='Heading 2'] => h2:fresh"]});editor.innerHTML=result.value||'<p></p>';$('#filename').value=file.name.replace(/\.docx$/i,'');msg(result.messages.length?'載入完成；複雜格式可能無法完整保留':'載入完成，可開始編輯',!!result.messages.length)}catch(err){msg('開啟失敗：'+err.message,true)}finally{document.body.classList.remove('statusbusy')}};
$('#saveBtn').onclick=()=>{const title=$('#filename').value||'文件';const html='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:"Microsoft JhengHei",sans-serif;line-height:1.75;max-width:210mm;margin:20px auto;padding:18mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:6px}img{max-width:100%}</style></head><body>'+editor.innerHTML+'</body></html>';download(new Blob([html],{type:'text/html;charset=utf-8'}),title+'.html');msg('HTML 已下載')};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#pdfBtn').onclick=async()=>{document.body.classList.add('statusbusy');msg('正在產生 PDF…');try{await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js','html2pdf');await html2pdf().set({margin:[12,12,12,12],filename:($('#filename').value||'文件')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:innerWidth<640?1.5:2,useCORS:true,letterRendering:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:$('#pageSize').value,orientation:$('#orientation').value},pagebreak:{mode:['css','legacy'],avoid:['tr','img']}}).from(editor).save();msg('PDF 已下載')}catch(err){msg('PDF 產生失敗：'+err.message+'；可改用「列印」後選擇另存為 PDF。',true)}finally{document.body.classList.remove('statusbusy')}};
$('#orientation').onchange=e=>editor.classList.toggle('landscape',e.target.value==='landscape');$('#findToggle').onclick=()=>{$('#findbar').style.display=$('#findbar').style.display==='flex'?'none':'flex'};$('#findNext').onclick=()=>window.find($('#findText').value);$('#replaceOne').onclick=()=>{if(window.find($('#findText').value))document.execCommand('insertText',false,$('#replaceText').value)};$('#replaceAll').onclick=()=>{const f=$('#findText').value,r=$('#replaceText').value;if(!f)return;const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let n=0,node,nodes=[];while(node=walker.nextNode())nodes.push(node);nodes.forEach(x=>{const p=x.nodeValue.split(f);if(p.length>1){n+=p.length-1;x.nodeValue=p.join(r)}});msg('已取代 '+n+' 處')};
</script>
</body></html>
